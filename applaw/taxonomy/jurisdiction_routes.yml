- id: ru-credit-addons
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [credit-addon-not-separate-application, prechecked-paid-option]
  candidate_norms: [ru-353fz-7-addons-cooling]
  required_facts: [ru-credit-product-context, ru-consumer-b2c-transaction]
  disqualifying_facts: [separate-credit-application-present]
  source_anchor_ids: [norm:ru-353fz-7-addons-cooling]
  condition: "По обзору (стр. 32): кредитные допуслуги подключаются только через отдельное заявление с ценой и правом отказа; период охлаждения возвращает деньги за навязанную услугу, а интерфейс выдачи показывает статус самозапрета с понятным отказом. Это уточняет общий запрет ст. 16 ЗоЗПП внутри кредитной вертикали."

- id: ru-crypto-checkout
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [crypto-payment-offered]
  candidate_norms: [ru-259fz-no-crypto]
  required_facts: []
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-259fz-no-crypto]
  condition: "По обзору (стр. 33): «оплата криптовалютой» российским клиентам не предлагается, а криптоэкраны избегают рублёвой образности."

- id: ru-regulated-messengers
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [foreign-messenger-contact]
  candidate_norms: [ru-antifraud-foreign-messengers]
  required_facts: [ru-regulated-entity-context]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-antifraud-foreign-messengers]
  condition: "По обзору (стр. 23): банки, операторы связи, государственные учреждения, крупные агрегаторы и маркетплейсы не информируют клиентов через иностранные мессенджеры — никаких кнопок «написать нам в WhatsApp»; реквизиты акта несут собственную пометку обзора «номер проверить» (стр. 53)."

- id: ru-landing-feedback
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-landing-feedback-form]
  candidate_norms: [ru-236fz-landing]
  required_facts: [ru-foreign-owner-confirmed, ru-foreign-500k-audience-confirmed]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-236fz-landing]
  condition: "По обзору (стр. 17): крупный иностранный ресурс с аудиторией более 500 тыс. пользователей из РФ в сутки несёт форму обратной связи для граждан России; оба порога применимости невидимы на экране и должны быть подтверждены."

- id: ru-gov-eforms
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [eform-loses-input]
  candidate_norms: [ru-pp-236-eforms]
  required_facts: [ru-government-service-context]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-pp-236-eforms]
  condition: "По обзору (стр. 44): формы госуслуг сохраняют введённые данные, позволяют шаг назад, хранят черновик три месяца, принимают файлы и предзаполняются из профиля; некоторые сроки несут пометку обзора «проверить»."

- id: ru-accessibility
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [accessibility-breakage, error-color-only]
  candidate_norms: [ru-pp-102-a11y, ru-gost-52872]
  required_facts: []
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-pp-102-a11y]
  condition: "По обзору (стр. 38-39): государственные интерфейсы с 01.03.2026 держат базовый уровень ПП 102 — масштабирование 200%, экранные дикторы, останавливаемая анимация, не более трёх вспышек в секунду, контраст по ГОСТ, — а ГОСТ Р 52872 обязателен для госсектора через ПП 1546 и для бизнеса только когда на него ссылается договор или ТЗ. Вне государственного контекста или подтверждённой ссылки в договоре вывод ограничивается уровнем лучшей практики по обзору; ошибка, показанная одним лишь цветом, — собственная строка тёмной таблицы обзора."

- id: ru-service-captions
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-captions]
  candidate_norms: [ru-181fz-15-captions]
  required_facts: []
  disqualifying_facts: [captions-present]
  source_anchor_ids: [norm:ru-181fz-15-captions]
  condition: "По обзору (стр. 39): аудио и видео об услугах для населения снабжаются субтитрами или текстовой расшифровкой, а экстренная информация остаётся доступной; маркетинговые медиа вне информации об услугах — зона рекомендаций."

- id: ru-gost-claim
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [authority-claim]
  candidate_norms: [ru-162fz-26, ru-38fz-5-3]
  required_facts: [ru-advertising-or-promo-claim-present]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-162fz-26]
  condition: "По обзору (стр. 5): публичное заявление «соответствует ГОСТ…» правомерно только при реальном соответствии; необоснованное заявление квалифицируется и как нарушение закона о стандартизации, и как недостоверная реклама по ст. 5 ч. 3 38-ФЗ."

- id: ru-ai-rights
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [ai-output-rights-missing]
  candidate_norms: [ru-ai-generation-rights]
  required_facts: []
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-ai-generation-rights]
  condition: "По обзору (стр. 48, 55): условия ИИ-сервиса содержат раздел «кому принадлежит сгенерированное», а пользователь видит информацию о правах; реквизиты закона несут собственную пометку обзора «проверить», поэтому ссылки остаются в формулировке обзора."

- id: ru-likeness
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [unconsented-person-photo]
  candidate_norms: [ru-gk-152-1-likeness]
  required_facts: [operator-confirmed-no-consent]
