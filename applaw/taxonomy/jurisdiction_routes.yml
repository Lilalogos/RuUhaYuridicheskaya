  condition: "По обзору (стр. 16): элемент «Пожаловаться» у каждого объекта контента, опубликованные правила, самостоятельный контроль запрещённого контента и ограничения монетизации для страниц вне реестра. Обязанность распространяется на соцсети с аудиторией более 500 000 российских пользователей в сутки — собственная поправка обзора к черновику (стр. 2), — а порог никогда не виден на экране, поэтому маршрут требует подтверждения оператора."

- id: ru-child-barriers-route
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-adult-gate]
  candidate_norms: [ru-child-access-barriers]
  required_facts: []
  disqualifying_facts: [ru-adult-barrier-present]
  source_anchor_ids: [norm:ru-child-access-barriers]
  condition: "По обзору (стр. 35): разделы, запрещённые для детей, находятся за возрастным барьером с безопасным поиском и размытыми превью; одна кнопка «Мне есть 18» — минимальная мера, а не гарантия. Подзаконный приказ несёт собственную пометку обзора «проверить актуальность», поэтому детали уровня приказа остаются условными до приложения текста."

- id: ru-media-imprint-route
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-media-imprint]
  candidate_norms: [ru-media-imprint]
  required_facts: [ru-registered-media-outlet]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-media-imprint]
  condition: "По обзору (стр. 17, 21): зарегистрированное сетевое издание несёт выходные данные — название, учредитель, редактор, свидетельство о регистрации — и знак «18+» на каждой странице. Обязанность распространяется только на зарегистрированные СМИ; статус никогда не виден на экране, поэтому маршрут требует подтверждения."

# Маршруты волны 3a
- id: ru-misleading-service-claims
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [free-claim, renewal-price-mismatch, fake-analysis, false-personalization, tailored-plan-claim, fake-dating-interlocutors, misleading-trial-period]
  candidate_norms: [ru-zozpp-12, ru-zozpp-10]
  required_facts: [ru-consumer-b2c-transaction]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-zozpp-12]
  condition: "По обзору (стр. 25): ненадлежащая информация даёт основание для отказа от договора, возврата денег и возмещения убытков, а неполная карточка — основание для возврата даже надлежащего товара. Сфабрикованные анализы, ложная персонализация, поддельные собеседники и недостоверные заявления о бесплатности или продлении — недостоверная информация об услуге по ст. 10/12 ЗоЗПП; подлинность элементов типа социального доказательства по-прежнему проходит через трёхзначный (tri-state) модуль."

- id: ru-distance-sale-returns
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [misleading-trial-period, trial-framing, money-back-misdirection, refund-obstruction]
  candidate_norms: [ru-zozpp-26-1]
  required_facts: [ru-consumer-b2c-transaction]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-zozpp-26-1]
  condition: "По обзору (стр. 27): срок и порядок возврата показаны в карточке и в чекауте; раздел «Возврат» на сайте не заменяет письменного уведомления при доставке, а без него 7-дневный срок возврата растягивается до 3 месяцев. Формулировки о пробном периоде и возврате денег проверяются по этим видимым условиям."

- id: ru-personalized-price
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [personalized-price-discrimination]
  candidate_norms: [ru-gk-426]
  required_facts: [ru-consumer-b2c-transaction, identity-linked-price-difference-shown]
  disqualifying_facts: [published-loyalty-rules-linked]
  source_anchor_ids: [norm:ru-gk-426]
  condition: "По обзору (стр. 27, 31): по публичному договору цена и условия равны внутри категории потребителей; персональная цена для «лояльного» или «нового» клиента — риск его нарушения, а скидки существуют только в рамках объявленных программ — поэтому вывод оформляется как риск по обзору и отменяется видимо привязанными опубликованными правилами программы."

- id: ru-offer-acceptance
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-express-consent, hidden-renewal, one-click-upsell, payment-without-renewal-disclosure]
  candidate_norms: [ru-gk-oferta]
  required_facts: [ru-consumer-b2c-transaction]
  disqualifying_facts: [express-opt-in-action-required]
  source_anchor_ids: [norm:ru-gk-oferta]
  condition: "По обзору (стр. 29, 50): оферта доступна до оплаты, акцепт — отдельное явное действие с фиксацией его версии и момента, автопродление описано до оформления подписки, а «продолжая, вы соглашаетесь приобрести…» ничего не доказывает (ст. 437-438 ГК РФ). Сам журнал акцептов на экране не виден и остаётся в Missing Context."

- id: ru-online-receipt
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [receipt-destination-missing]
  candidate_norms: [ru-54fz-receipt]
  required_facts: [ru-consumer-b2c-transaction]
  disqualifying_facts: [receipt-destination-field-present]
  source_anchor_ids: [norm:ru-54fz-receipt]
  condition: "По обзору (стр. 28): электронный чек направляется на телефон или e-mail, указанные до расчёта, поэтому поле «Куда прислать чек» предшествует элементу «Оплатить»."

- id: ru-owner-identity
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-owner-identity]
  candidate_norms: [ru-149fz-10-2, ru-zozpp-10]
  required_facts: []
  disqualifying_facts: [owner-identity-visible]
  source_anchor_ids: [norm:ru-149fz-10-2]
  condition: "По обзору (стр. 16): футер несёт наименование владельца, ИНН/ОГРН и контакты; для потребительских продаж та же обязанность по идентификации проходит через ст. 8-10 ЗоЗПП. Отсутствие оценивается только по показанным страницам — незахваченный футер оставляет факт неизвестным."

- id: ru-separate-consent
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [bundled-consent, cookie-single-accept]
  candidate_norms: [ru-152fz-9, ru-152fz-15]
  required_facts: [ru-consumer-b2c-transaction]
  disqualifying_facts: [separate-unticked-consent-present]
  source_anchor_ids: [norm:ru-152fz-9]
  condition: "По обзору (стр. 13, 29-30): с 01.09.2025 согласие на обработку данных — отдельный неотмеченный чекбокс с собственным текстом, отдельно от оферты; один объединённый чекбокс на оферту, данные и маркетинг нарушает ст. 9 и 15 152-ФЗ вместе с правилом о рассылках. Cookie-баннер с одной кнопкой «Принять» — по собственным словам обзора, риск, а не норма (стр. 15), такие выводы ограничиваются уровнем риска."

- id: ru-marketing-mailings
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [unsubscribe-link-missing]
  candidate_norms: [ru-38fz-18, ru-152fz-15]
  required_facts: []
  disqualifying_facts: [unsubscribe-link-present]
  source_anchor_ids: [norm:ru-38fz-18]
  condition: "По обзору (стр. 19, 29): маркетинг по SMS, e-mail или push ведётся только по отдельному предварительному согласию — собственный неотмеченный чекбокс «получать рекламу», никогда не внутри согласия на обработку данных, — каждое сообщение содержит «отписаться», обработка прекращается немедленно по требованию, а согласия журналируются (журнал вне экрана, Missing Context)."

- id: ru-privacy-policy-link
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [privacy-policy-link-missing]
  candidate_norms: [ru-152fz-18-1]
  required_facts: []
  disqualifying_facts: [privacy-policy-link-visible]
  source_anchor_ids: [norm:ru-152fz-18-1]
  condition: "По обзору (стр. 14): политика обработки опубликована в неограниченном доступе, ссылка на неё стоит у каждой формы и в футере; вывод оценивает только показанные экраны."

- id: ru-consent-withdrawal
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [consent-withdrawal-obstructed]
  candidate_norms: [ru-152fz-withdrawal]
  required_facts: []
  disqualifying_facts: [minor-neutral-confirmation-steps-only]
  source_anchor_ids: [norm:ru-152fz-withdrawal]
  condition: "По обзору (стр. 14): в настройках есть «отозвать согласие» и «удалить аккаунт»; «не сложнее, чем дать согласие» — собственная рекомендательная пометка обзора, а таблица тёмных паттернов оформляет затруднённый отзыв как риск, поскольку оператор обязан прекратить обработку по требованию (стр. 31) — выводы ограничиваются соответственно."

- id: ru-automated-decisions
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [no-automated-decision-recourse]
  candidate_norms: [ru-152fz-16]
  required_facts: []
  disqualifying_facts: [appeal-control-present]
  source_anchor_ids: [norm:ru-152fz-16]
  condition: "По обзору (стр. 14, 55): сугубо автоматизированное решение с юридическими последствиями требует письменного согласия, экрана с объяснением и работающего элемента «оспорить» с рассмотрением человеком; чистые рекомендации относятся к обязанности уведомлять о рекомендательных технологиях."

- id: ru-biometric-login
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [biometric-only-login]
  candidate_norms: [ru-152fz-11-biometric]
  required_facts: []
  disqualifying_facts: [alternative-login-present]
  source_anchor_ids: [norm:ru-152fz-11-biometric]
  condition: "По обзору (стр. 14, 50): вход по лицу или голосу существует только рядом с альтернативным способом и по отдельному согласию в письменной форме (электронный документ с подписью — Госуслуги, Госключ, ПЭП по соглашению об ЭДО); одного чекбокса недостаточно."

- id: ru-ad-marking
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [ad-disguised-as-organic]
  candidate_norms: [ru-38fz-18-1]
  required_facts: []
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-38fz-18-1]
  condition: "По обзору (стр. 18, 20-21, 31): каждый интернет-креатив несёт пометку «Реклама», рекламодателя (или ссылку) и токен erid; нативные интеграции получают явную пометку, платные позиции в поиске и подборках — собственную пометку «Реклама», а ярлык «партнёрский материал» без erid маркировку не заменяет."

- id: ru-promo-terms
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [promo-rules-missing]
  candidate_norms: [ru-38fz-9]
  required_facts: []
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-38fz-9]
  condition: "По обзору (стр. 19): баннер стимулирующей акции указывает срок, организатора и место размещения правил — ссылку на правила с датами. Реальны ли обратный отсчёт или подарок — вопрос ст. 5 ч. 3 38-ФЗ."

- id: ru-authorization-methods
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [foreign-sso-only]
  candidate_norms: [ru-149fz-10-auth]
  required_facts: []
  disqualifying_facts: [russian-auth-method-available]
  source_anchor_ids: [norm:ru-149fz-10-auth]
  condition: "По обзору (стр. 16, 31): российские пользователи авторизуются только по номеру российского оператора, через ЕСИА, ЕБС или иную систему под российским контролем — «Войти через Google / Apple / Facebook» убирается с экрана; телефон, Госуслуги, VK ID, Яндекс ID, Сбер ID и подобные остаются. Дата вступления в силу сопутствующего состава несёт собственную пометку обзора «проверить»."

- id: ru-recommender-notice
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [missing-recsys-notice]
  candidate_norms: [ru-149fz-10-2-2]
  required_facts: []
  disqualifying_facts: [recsys-notice-visible]
  source_anchor_ids: [norm:ru-149fz-10-2-2]
  condition: "По обзору (стр. 16, 20): любая персонализация контента, товаров, цен или рекламы для россиян требует видимого уведомления о рекомендательных технологиях со ссылкой на правила применения (какие данные, откуда, как влияют на выдачу), а также наименования владельца и e-mail для юридически значимых сообщений; закон не требует выключателя, а отсутствие оценивается только по показанным экранам."

# Маршруты волны 3b
- id: ru-credit-psk
  jurisdiction: "RU"
  sub_jurisdiction: null
