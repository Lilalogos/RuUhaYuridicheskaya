  condition: "По Указанию Банка России N 3854-У (evidence/law/cbr-3854u-2015, стр. 3–4): страхователь — физическое лицо вправе отказаться от договора добровольного страхования в течение четырнадцати календарных дней с возвратом премии. Маршрут срабатывает только для добровольной страховой допуслуги, проданной потребителю, когда интерфейс после покупки препятствует такому отказу или отказывает в нём («страховка не возвращается», нет пути отмены в течение 14 дней). Нейтральное подтверждение само по себе его не активирует."
