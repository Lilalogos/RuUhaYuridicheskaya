- id: ru-false-advertising
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [fake-social-proof, fake-external-reviews, fake-social-media-reviews, fake-awards, before-after-social-proof, fake-installs-purchases, fake-predictive-progress-graphs, misused-scientific-evidence, fake-media-features, fake-university-endorsement, fake-promo-code-countdown, pseudo-gifts, urgency-timer, authority-claim, outcome-promise, outcome-teaser, free-claim]
  candidate_norms: [ru-38fz-5-3]
  required_facts: [ru-advertising-or-promo-claim-present]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-38fz-5-3]
  condition: "Применять ст. 5 ч. 3 и 7 38-ФЗ о рекламе только к видимому рекламному утверждению и только в той мере, в какой это несёт обзорный PDF: «Лучший», «№ 1» требуют подтверждения и источника; существенные условия не должны стоять мелким или бледным шрифтом (практика ФАС, стр. 18); «Таймеры и „осталось 2 штуки“ без оснований» — нарушение, если не соответствуют действительности (стр. 30). Приложенные источники не содержат отдельного правила об отзывах, поэтому сфабрикованные отзывы или социальное доказательство квалифицируются здесь только как недостоверное рекламное утверждение — вывод ограничен подтверждённой оператором фабрикацией или ложностью, видимой на самом экране, а подлинностью управляет трёхзначный (tri-state) модуль социального доказательства; неразрешённая подлинность оставляет наблюдение непроверенным, а не нарушением. Статус B2C не требуется: обзор указывает, что закон о рекламе применяется независимо от B2B или B2C (стр. 17)."

