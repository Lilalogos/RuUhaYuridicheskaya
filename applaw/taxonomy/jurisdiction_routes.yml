# плюс сверка по pravo.gov.ru, отмеченная в каждой записи. См. docs/ru-fork-notes.md.

- id: ru-prechecked-paid-addon
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [prechecked-paid-option, unauthorized-add-on, bundled-consent, missing-express-consent, hidden-upsell-subscription, one-click-upsell]
  candidate_norms: [ru-zozpp-16]
  required_facts: [ru-consumer-b2c-transaction, ru-additional-paid-service-preselected]
  disqualifying_facts: [express-opt-in-action-required]
  source_anchor_ids: [norm:ru-zozpp-16]
  condition: "Применять ст. 16 ЗоЗПП только для потребительского (B2C) флоу, где платная допуслуга предвыбрана, включена по умолчанию или уже находится в заказе без отдельного активного выбора. Обзорный PDF (стр. 26, 30) трактует предотмеченный чекбокс платной услуги и допуслугу или подписку, уже лежащую в корзине, как запрещённые без отдельного согласия, а «продолжая, вы соглашаетесь приобрести…» — как недоказанное согласие (вместе со ст. 438 ГК РФ); бремя доказывания согласия лежит на продавце, который обязан хранить версию экрана, состав заказа, дату, время и действие пользователя (стр. 31). Действительно неотмеченная допуслуга с собственной видимой ценой этот маршрут не активирует."

- id: ru-conditioned-purchase
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [obstruction-to-decline, hard-to-close-upsell]
  candidate_norms: [ru-zozpp-16]
  required_facts: [ru-consumer-b2c-transaction, ru-decline-addon-blocks-primary-purchase]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-zozpp-16]
  condition: "Применять запрет обусловливания по ст. 16 ЗоЗПП только когда отказ от дополнительной платной услуги блокирует или ухудшает основную покупку; обзорный PDF называет ровно эту строку: «Отказ от доп. услуги блокирует основную покупку» — «Запрещённое обусловливание» (стр. 30). Апсейл, который лишь трудно закрыть, пока основной заказ всё равно завершается на тех же условиях, остаётся наблюдением о давлении без этого маршрута."

- id: ru-total-price-disclosure
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [mandatory-fee-drip-pricing, delayed-price-disclosure, below-fold-disclosure, payment-without-clear-disclosure, email-before-price, no-price-upsell, personalization-lure]
  candidate_norms: [ru-zozpp-10]
  required_facts: [ru-consumer-b2c-transaction, material-pricing-term-omitted-or-subordinated-at-invitation]
  disqualifying_facts: [ru-total-price-displayed-before-payment]
  source_anchor_ids: [norm:ru-zozpp-10]
  condition: "Применять ст. 8–10 ЗоЗПП для потребительского флоу, где сведения о продавце или полная цена в рублях с условиями оплаты, доставки и гарантии отсутствуют, скрыты ниже первого экрана или существенно принижены до шага заключения договора. Собственное прочтение обзора: итоговая цена должна быть без сюрпризов на последнем шаге (стр. 25), а «Скрытая полная стоимость: платежи появляются на последнем шаге» нарушает обязанность указать цену и условия до договора (стр. 30); перечень обязательного содержания карточки — на стр. 29. Полный рублёвый итог, показанный до действия оплаты, этот маршрут отменяет."

- id: ru-subscription-refusal-and-saved-card
  jurisdiction: "RU"
  sub_jurisdiction: null
  pattern_ids: [post-cancellation-billing, hard-cancellation, cancellation-contact-channel-mismatch, asymmetric-cancellation-path]
  candidate_norms: [ru-zozpp-16-1]
  required_facts: [ru-consumer-b2c-transaction, ru-recurring-charge-enabled, ru-electronic-refusal-path-absent]
  disqualifying_facts: []
  source_anchor_ids: [norm:ru-zozpp-16-1]
  condition: "Применять ст. 16.1 ЗоЗПП (формулировка закона о подписках, действует с 01.03.2026 по обзору, стр. 26, 64) только там, где включены периодические списания с сохранённых реквизитов, а продукт не даёт электронного самостоятельного отказа: «Удалить карту» и «Отключить автопродление» должны работать без звонка в поддержку, дата и время отказа должны фиксироваться, а списания после выраженного отказа запрещены (стр. 26). «Отмена подписки только по телефону или письмом» — названное обзором нарушение: нет электронного отказа (стр. 31); кнопка, визуально удаляющая карту при продолжающихся списаниях, — отказ, выраженный действием, высокий риск (стр. 30). Четыре действия различать: отменить подписку, отключить автопродление, отказаться от карты, удалить способ оплаты (стр. 26)."

