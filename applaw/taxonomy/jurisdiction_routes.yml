  condition: "Отраслевой слой для авиабилетов: архивные акты (НордСтар А33-35161/2019, стр. 5–9; Нордстар 2-917/2025, стр. 4; ИрАэро 2-339/2024; Уральские авиалинии 33-17149/2023) применяют ФАП-82 и Воздушный кодекс вместе со ст. 16 ЗоЗПП — обязательная платная «услуга оформления провозной ёмкости» или автоматически подключённая страховка противоречит правилам перевозок. Срабатывает только когда экран — флоу бронирования авиаперевозки; общий маршрут по ст. 16 ЗоЗПП по-прежнему работает."
