  enforcer: "составы КоАП 20.3 и 6.21, 6.21.1, 6.21.2 (стр. 10 PDF; части 6.21 PDF помечает «проверить»)"
  remedy: "по PDF: шестицветный радужный флаг и его стилизации — символика запрещённой организации; «никакой радужной и прайд-символики» в иллюстрациях, промо и стикерах; поле «пол» в юридически значимых данных — только М/Ж (стр. 10)"
  summary: "PDF квалифицирует шестицветную радужную символику и её стилизации как символику организации, признанной экстремистской решением ВС РФ от 30.11.2023, с практикой штрафов «даже за украшения», а блок 478-ФЗ запрещает соответствующую «пропаганду» в иллюстрациях, промо и стикерах."
  public_enforcement: "КоАП 20.3 (символика) и КоАП 6.21/6.21.1/6.21.2 — «до 5 млн ₽ для юрлиц (проверить по частям)» — формулировка и оговорка самого PDF (стр. 10)."
  private_enforcement: "Отсутствует по приложенным источникам."
  penalty_basis: "КоАП 20.3; КоАП 6.21, 6.21.1, 6.21.2; УК 282.2–282.4 — как перечислено на стр. 10, 60 PDF; суммы, кроме названного самим PDF ориентира с меткой «проверить», не фиксируются."
  limitations: "Основание по символике — судебное решение и практика: PDF прямо отмечает «практика штрафов есть даже за украшения» и что практика шире буквы (стр. 10); находка формулируется в терминах источника, с «пропагандой» в кавычках. Детская аудитория — отдельный режим 436-ФЗ (волна 2)."
