- id: ru-zozpp-16-1-digital-ruble
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Закон РФ «О защите прав потребителей», ст. 16.1 п. 1 абз. 5–7 — обязанность обеспечить оплату цифровыми рублями (ФЗ от 23.07.2025 N 248-ФЗ)"
  citation: "ст. 16.1 п. 1 абз. 5–7 Закона РФ N 2300-1 (введены ФЗ от 23.07.2025 N 248-ФЗ); поэтапно: клиенты системно значимых банков с выручкой свыше 120 млн ₽ — с 01.09.2026, свыше 30 млн ₽ — с 01.09.2027, остальные с выручкой свыше 20 млн ₽ — с 01.09.2028"
  type: "material"
  enforcer: "Роспотребнадзор; КоАП 14.8 ч. 4 (неисполнение обязанности обеспечить возможность оплаты)"
  remedy: "продавец (исполнитель, владелец агрегатора) с выручкой свыше порога обязан обеспечить потребителю возможность оплаты путём перевода цифровых рублей; исключения — места без связи и торговые объекты с выручкой до 5 млн ₽"
  summary: "В чекауте крупного продавца с 01.09.2026 должен быть способ оплаты «цифровой рубль» наравне с картами «Мир» — отсутствие такого способа у обязанного продавца нарушает ст. 16.1."
  source_url: "https://www.consultant.ru/document/cons_doc_LAW_305/287ba272fb77db736b18354d3eec00164e7fd104/"
  availability: "full"
  consumer_redress: "Не установлено по приложенным источникам."
  public_enforcement: "Роспотребнадзор; КоАП 14.8 ч. 4 (evidence/law/koap-195-fz_st14-8, стр. 2)."
  private_enforcement: "Не установлено по приложенным источникам."
  penalty_basis: "КоАП 14.8 ч. 4; размеры штрафов в базе не хранятся."
  non_monetary_relief: "Не установлено по приложенным источникам."
  limitations: "Порог выручки и категория обслуживающего банка с экрана не видны — факты только от оператора; до 01.09.2026 норма не действует (effective-date-гейт). Паттерна «отсутствует обязательный способ оплаты» в базе нет — норма недостижима до его принятия (docs/unmapped-norms.md)."
  who_may_act: "Потребитель; Роспотребнадзор."
