- id: ru-interface-language
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "53-ФЗ от 01.06.2005 «О государственном языке РФ» (ред. 52-ФЗ от 28.02.2023 и 168-ФЗ от 24.06.2025, в силе с 01.03.2026) — язык интерфейса для потребителей"
  citation: "ст. 3 53-ФЗ от 01.06.2005 (ред. 168-ФЗ от 24.06.2025, с 01.03.2026)"
  type: "material"
  enforcer: "Роспотребнадзор; КоАП 14.8 ч. 1 (стр. 9 PDF; «ожидается спецсостав»)"
  remedy: "весь интерфейс для потребителей — кнопки, меню, формы, cookie-баннер, карточки, оферта — на русском; русский первым, дубль на другом языке равнозначен по цвету, шрифту, кеглю и разборчивости; без перевода — только зарегистрированные товарные знаки и фирменные наименования из ЕГРЮЛ (стр. 8–9 PDF)"
  summary: "С 01.03.2026 публичный потребительский интерфейс ведётся на русском языке: русский первым, иноязычный дубль строго равнозначен по оформлению, а без перевода остаются только товарные знаки и фирменные наименования из ЕГРЮЛ."
