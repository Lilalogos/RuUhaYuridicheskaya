  instrument: "149-ФЗ, ст. 15.8 — запрет популяризации средств обхода блокировок (с 01.03.2024); запрет рекламы VPN (ред. 38-ФЗ 2024–2025)"
  citation: "ст. 15.8 149-ФЗ; 38-ФЗ (ред. 2024–2025) в части рекламы VPN"
  type: "material"
  enforcer: "составы КоАП 14.3 (реклама), 13.52, 13.53 (стр. 13, 18, 59 PDF)"
