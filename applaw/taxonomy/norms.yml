- id: ru-banned-orgs-presence
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Перечни Минюста и ФСБ экстремистских и террористических организаций; решение Тверского суда Москвы от 21.03.2022 (Meta: Instagram и Facebook); Закон о СМИ ст. 4 — статус при упоминании"
  citation: "перечни Минюста/ФСБ; решение Тверского суда Москвы от 21.03.2022; ст. 4 Закона РФ от 27.12.1991 N 2124-1"
  type: "material"
  enforcer: "составы КоАП 20.3 и 20.29 (стр. 11, 60 PDF)"
  remedy: "убрать иконки и ссылки Instagram и Facebook из футеров и шеринга; никаких «войти через Facebook», «мы в Instagram», рекламы, интеграций и донатов в их пользу; при текстовом упоминании — пометка о статусе организации (стр. 11, 20, 22 PDF)"
  summary: "Логотипы, кнопки шеринга, вход через сервисы и ссылки запрещённых организаций (Instagram, Facebook/Meta и другие из перечней) в интерфейсе недопустимы — PDF фиксирует практику штрафов даже за логотипы; текстовое упоминание сопровождается пометкой о статусе."
  public_enforcement: "КоАП 20.3 (символика, включая логотипы — «риск 20.3 при логотипах», стр. 20) и 20.29 (распространение материалов); для СМИ — 13.15 ч. 2 (стр. 20, 60 PDF)."
  private_enforcement: "Отсутствует по приложенным источникам."
  penalty_basis: "КоАП 20.3, 20.29; УК 282.2, 282.3 (участие/финансирование — донаты) — стр. 11, 60–61 PDF; суммы не фиксируются (стр. 57)."
  limitations: "Статусы меняются: PDF требует сверять перечни Минюста/ФСБ и реестр РКН еженедельно перед релизом (стр. 22, 62–63). Пометка статуса — норма Закона о СМИ ст. 4 для изданий и «устойчивая практика» для остальных сайтов (стр. 13 PDF): для не-СМИ вывод ограничивается риском по практике. Реклама на заблокированных ресурсах запрещена с 01.09.2025 (стр. 17). Рекламная грань сверена по тексту ст. 5 38-ФЗ (evidence/law/fz-38-reklama_st5): ч. 10.7 (введена ФЗ от 07.04.2025 N 72-ФЗ, с 01.09.2025) запрещает распространение рекламы на ресурсах нежелательных и запрещённых организаций и на заблокированных ресурсах; применение — Хабаровское УФАС ТТ/860/26 (реклама в Instagram; «реклама на запрещенном ресурсе не допускается»)."
