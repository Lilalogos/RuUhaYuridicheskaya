- id: ru-gk-oferta
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "ГК РФ, ст. 428, 429.4, 435, 437, 438, 494, 497 — договор присоединения, абонентский договор, оферта и акцепт действием при дистанционной продаже"
  citation: "ст. 428, 429.4, 435, 437, 438, 494, 497 ГК РФ"
  type: "material"
  enforcer: "гражданско-правовые последствия: недействительность условий, спор о заключённости (стр. 29, 50 PDF)"
  remedy: "оферта доступна до оплаты и до нажатия «Оплатить»; отдельная галочка принятия условий; момент акцепта явный, версия оферты и момент акцепта фиксируются; автопродление описано до подписки; ссылка на оферту — в чеке и письме (стр. 29, 50 PDF)"
  summary: "Кнопка «Оплатить» юридически работает только при выстроенной цепочке: оферта видна до оплаты, принятие условий — отдельной галочкой, момент акцепта и версия оферты фиксируются, автопродление описано до подписки, а «продолжая, вы соглашаетесь приобрести…» согласия не доказывает."
  consumer_redress: "Недействительность навязанных условий; спор о заключённости и условиях (стр. 29, 50 PDF)."
  public_enforcement: "Не установлено по приложенным источникам."
