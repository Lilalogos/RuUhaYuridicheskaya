  instrument: "Закон РФ «О защите прав потребителей», ст. 32; ГК РФ, ст. 782 — отказ потребителя от услуги в любой момент"
  citation: "ст. 32 Закона РФ от 07.02.1992 N 2300-1; ст. 782 ГК РФ"
  type: "material"
  enforcer: "Роспотребнадзор (КоАП 14.8 по PDF, стр. 26)"
  remedy: "отказ от услуги в любой момент с оплатой только фактических расходов исполнителя (стр. 26 PDF)"
  summary: "От платной услуги потребитель вправе отказаться в любой момент, оплатив только фактические расходы исполнителя; по прочтению PDF это означает отмену подписки на услуги в любой момент из кабинета, а возврат за неиспользованный период PDF отмечает как практику."
  source_url: "http://pravo.gov.ru/proxy/ips/?docbody=&link_id=0&nd=102014512&intelsearch=&firstDoc=1"
  availability: "partial"
  consumer_redress: "Отказ в любой момент с оплатой фактических расходов; возврат за неиспользованный период — помечен в PDF как «(практика)», не прямая норма (стр. 26)."
  public_enforcement: "КоАП 14.8 (стр. 26, 59 PDF); суммы санкций в приложенном PDF не приведены (стр. 57)."
  private_enforcement: "Прямое право потребителя на отказ от услуги и возврат (стр. 26 PDF); процессуальный порядок в приложенных источниках не описан."
  penalty_basis: "КоАП РФ, ст. 14.8 (стр. 59 PDF); размеры штрафов в приложенных источниках отсутствуют (стр. 57)."
  non_monetary_relief: "Не установлено по приложенным источникам."
  limitations: "Применяется к услугам, а не к продаже товаров; B2C-фильтр (стр. 25 PDF). Возврат за неиспользованный период — практика, а не буква нормы (стр. 26). Приложенный PDF — обзор: редакцию сверять по первоисточнику перед релизом (стр. 1)."
  who_may_act: "Потребитель; Роспотребнадзор (стр. 26 PDF). Иное не установлено по приложенным источникам."
  adjudicator: "Не установлено по приложенным источникам."
