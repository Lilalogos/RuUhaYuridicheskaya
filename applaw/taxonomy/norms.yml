  remedy: "каждый рекламный блок, промо в пуше и письме, продвигаемая карточка несут «Реклама» + рекламодателя (или ссылку на него) + токен erid; нативные интеграции и спецпроекты — с явной меткой; платные позиции в поиске и подборках — отдельной меткой «Реклама»; промо-лендинги — с реквизитами продавца (стр. 18, 20 PDF)"
  summary: "Любая интернет-реклама маркируется: слово «Реклама», рекламодатель и erid на каждом креативе, явная метка на нативе и платных позициях выдачи — «партнёрский материал» без erid маркировку не заменяет."
  consumer_redress: "Через материальные нормы ЗоЗПП; отдельного средства PDF не называет."
  private_enforcement: "Не установлено по приложенным источникам."
  public_enforcement: "ФАС; КоАП 14.3 (стр. 18, 59 PDF); отчисления и ЕРИР — инфраструктурная сторона (стр. 18)."
  penalty_basis: "КоАП 14.3 (стр. 59 PDF)."
  limitations: "«Реклама как органическая карточка» и «партнёрский материал без erid» — строки таблицы тёмных паттернов (стр. 21, 31). Запрет рекламы на заблокированных ресурсах — смежная норма (стр. 17–18)."
