# --- прогон «сбор пробелов» 2026-10-04: нормы из собранных актов и текстов законов ---
- id: ru-zozpp-46
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Закон РФ «О защите прав потребителей», ст. 46 — иски органов надзора и объединений потребителей в защиту неопределённого круга потребителей"
  citation: "ст. 46 Закона РФ от 07.02.1992 N 2300-1; п. 20, 53 Постановления Пленума ВС РФ от 28.06.2012 N 17"
  type: "procedural"
  companion_to_material_norm_ids: [ru-zozpp-10, ru-zozpp-16, ru-zozpp-16-1, ru-zozpp-32, ru-zozpp-12, ru-zozpp-26-1, ru-interface-language]
  enforcer: "Роспотребнадзор (территориальные управления) и общественные объединения потребителей — иск в суд общей юрисдикции о признании действий противоправными и прекращении (evidence/law/zozpp-2300-1_st46)"
  remedy: "признание действий противоправными в отношении неопределённого круга потребителей, обязанность прекратить, обязанность довести решение до сведения потребителей через СМИ в установленный судом срок"
  summary: "Основной маршрут публичного принуждения по интерфейсным нарушениям в собранных актах: не штраф, а гражданский иск Роспотребнадзора в защиту неопределённого круга потребителей — суд признаёт действия противоправными, обязывает прекратить и опубликовать решение (Уральские авиалинии, ИрАэро, Победа, Нордстар)."
  source_url: "https://www.consultant.ru/document/cons_doc_LAW_305/709f42c2ba58a4b3a219680a8e42c492adda2f63/"
  availability: "full"
  consumer_redress: "Не индивидуальное средство защиты: решение по иску в защиту неопределённого круга потребителей не присуждает выплат конкретному потребителю; его преюдициальное значение для частных исков — п. 53 Пленума ВС N 17 (evidence/law/plenum-vs-17-2012_04*)."
  public_enforcement: "Иск Роспотребнадзора или объединения потребителей в суд общей юрисдикции; в собранных актах — обязанность довести решение до потребителей через СМИ в 10 дней — 1 месяц (evidence/enforcement/2024-kuibyshevsky-irk-2-339-2024, стр. 15; 2024-mosgorsud-33-35439, стр. 3; 2025-geldor-krk-2-917-2025, стр. 7)."
  private_enforcement: "Отсутствует: состав процессуальный; частные требования потребителя идут через ст. 12, 16, 32 ЗоЗПП."
  penalty_basis: "Денежной санкции не предусматривает; с ответчика взыскивается госпошлина (300–6 000 ₽ в собранных актах)."
  non_monetary_relief: "Прекращение противоправных действий; публикация решения; признание действий противоправными."
  limitations: "Процедурный компаньон: применяется только при установленной материальной обязанности (ст. 10, 16, 16.1, 32 ЗоЗПП). Сам по себе иск по ст. 46 не подтверждает размера санкции и не является ориентиром денежного исхода."
  who_may_act: "Роспотребнадзор и его территориальные органы; органы местного самоуправления; общественные объединения потребителей (ст. 46 ЗоЗПП)."
  adjudicator: "Суды общей юрисдикции (районный суд → апелляция в областной суд → кассационный суд общей юрисдикции) — по собранным актам."
  limitation_period: "Не установлено по приложенным источникам."
  collective_route: "Это и есть коллективный маршрут: иск в защиту неопределённого круга потребителей (ст. 46 ЗоЗПП)."
  non_binding_forums: "Не установлено по приложенным источникам."
  liability_source_urls: ["https://www.consultant.ru/document/cons_doc_LAW_305/709f42c2ba58a4b3a219680a8e42c492adda2f63/", "https://www.consultant.ru/document/cons_doc_LAW_131885/"]
  eligible_outcome_ids: []
  verified_as_of: "2026-10-04"
- id: ru-cbr-3854u-cooling
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Указание Банка России от 20.11.2015 N 3854-У — минимальные требования к добровольному страхованию: право страхователя-физлица отказаться от договора в «период охлаждения»"
  citation: "п. 1, 5–7 Указания Банка России от 20.11.2015 N 3854-У (ред. от 21.08.2017)"
  type: "material"
  enforcer: "Банк России (надзор за страховщиками); гражданско-правовые последствия для потребителя"
  remedy: "страхователь — физическое лицо вправе отказаться от договора добровольного страхования в течение четырнадцати календарных дней со дня его заключения с возвратом премии (полностью, если страхование не началось; за вычетом части пропорционально сроку — если началось)"
  summary: "Любая добровольная страховка, проданная при покупке (авиастраховка, страхование багажа, защита покупки), несёт право потребителя отказаться от неё в 14 календарных дней с возвратом премии — интерфейс после покупки обязан давать такой путь, а не только «страховка не возвращается»."
  source_url: "https://www.consultant.ru/document/cons_doc_LAW_194262/"
  availability: "full"
  consumer_redress: "Возврат уплаченной страховой премии при отказе в течение 14 календарных дней (п. 5–6 Указания; evidence/law/cbr-3854u-2015, стр. 3–4); для страховок при кредите — также ст. 7 ч. 2.7 353-ФЗ."
  public_enforcement: "Надзор Банка России за страховщиками; состав КоАП для продавца-агента в приложенных источниках не установлен."
  private_enforcement: "Требование потребителя к страховщику о возврате премии; при отказе — иск по ЗоЗПП."
