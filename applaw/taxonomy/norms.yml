  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "353-ФЗ, ст. 7 — допуслуги к кредиту по отдельному заявлению; «период охлаждения»; 31-ФЗ от 26.02.2024 — самозапрет на кредиты (с 01.03.2025)"
  citation: "ст. 7 353-ФЗ; 31-ФЗ от 26.02.2024 (с 01.03.2025)"
  type: "material"
  enforcer: "предписания ЦБ; КоАП 15.26.х (стр. 32 PDF)"
  remedy: "согласие на допуслуги выражается заёмщиком в заявлении; страховка и допуслуги — отдельный активный выбор с ценой, экран отказа в период охлаждения; в сценарии выдачи — статусы «проверяем самозапрет» и «деньги поступят через N часов» (параметры — сверить) (стр. 32 PDF)"
  summary: "Согласие на допуслуги к кредиту заёмщик выражает в заявлении — отдельный активный выбор с ценой и экраном отказа в период охлаждения, а сценарий выдачи показывает проверку самозапрета и задержку крупных кредитов."
