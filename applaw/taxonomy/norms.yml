- id: ru-38fz-5-3
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Федеральный закон «О рекламе», ст. 5 ч. 3 и 7 — недостоверная реклама; умолчание о существенных условиях (смежно: ч. 9 — запрет скрытой рекламы)"
  citation: "ст. 5 ч. 3, 7 Федерального закона от 13.03.2006 N 38-ФЗ «О рекламе»"
  type: "material"
  enforcer: "ФАС (по PDF: практика ФАС по условиям мелким шрифтом, стр. 18); КоАП 14.3"
  remedy: "запрет недостоверных утверждений: «Лучший», «№ 1» — только с подтверждением и источником; существенные условия — не мелким и не бледным шрифтом; таймеры и «осталось 2 штуки» — нарушение при недостоверности (стр. 18, 30 PDF)"
  summary: "Рекламное или промо-утверждение в интерфейсе не должно быть недостоверным и не должно умалчивать существенные условия: превосходные степени — только с подтверждением и источником, условия — не мелким шрифтом, а счётчики дефицита и таймеры без фактических оснований PDF квалифицирует как нарушение именно этой нормы."
  source_url: "https://publication.pravo.gov.ru/"
  availability: "partial"
  consumer_redress: "Не установлено по приложенным источникам (частные последствия недостоверной информации идут через ЗоЗПП ст. 10, 12)."
  public_enforcement: "ФАС; КоАП 14.3 — «Нарушение законодательства о рекламе» прямо покрывает любой промо-блок, рассылку, пуш (стр. 18, 59 PDF). Суммы санкций в приложенном PDF не приведены (стр. 57)."
  private_enforcement: "Не установлено по приложенным источникам."
  penalty_basis: "КоАП РФ, ст. 14.3 (стр. 18, 59 PDF); размеры штрафов PDF намеренно не фиксирует (стр. 57)."
  non_monetary_relief: "Не установлено по приложенным источникам (предписания ФАС названы в PDF в общем контексте, стр. 29)."
  limitations: "38-ФЗ действует независимо от B2B или B2C: любой промо-блок, партнёрский баннер или продвигаемая карточка — реклама (стр. 17 PDF). Квалификация тёмных паттернов по PDF (стр. 30): «Таймеры и „осталось 2 штуки“ без оснований» — нарушение при недостоверности; для детской аудитории — отдельно 38-ФЗ ст. 6. Спец-нормы об отзывах в приложенных источниках нет: фейковые отзывы и соц-доказательства квалифицируются только как недостоверное рекламное утверждение по ч. 3 (плюс ЗоЗПП 10/12), поэтому вывод ограничен недостоверностью утверждения и требует подтверждённой фабрикации либо видимой на экране ложности."
  who_may_act: "ФАС (стр. 18 PDF). Иное не установлено по приложенным источникам."
