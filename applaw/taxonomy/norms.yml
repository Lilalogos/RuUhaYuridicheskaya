- id: ru-koap-14-8
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "КоАП РФ, ст. 14.8 — нарушение иных прав потребителей (информация, недопустимые условия, подписки)"
  citation: "ст. 14.8 КоАП РФ"
  type: "procedural"
  companion_to_material_norm_ids: [ru-zozpp-10, ru-zozpp-16, ru-zozpp-16-1, ru-zozpp-32, ru-interface-language, ru-zozpp-12, ru-zozpp-26-1]
  enforcer: "Роспотребнадзор (стр. 9 PDF: «Роспотребнадзор, КоАП 14.8 ч. 1»)"
  remedy: "административная ответственность за нарушения ЗоЗПП; конкретные суммы приложенный PDF намеренно не фиксирует (стр. 57)"
  summary: "Административный состав для потребительских нарушений в интерфейсе: непредоставление информации, недопустимые условия и нарушения по подпискам; триггеры в продукте по PDF — чекаут, карточка товара, автопродление (стр. 59)."
