- id: ru-zozpp-10
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Закон РФ «О защите прав потребителей», ст. 8–10 — информация о продавце и товаре до покупки"
  citation: "ст. 8–10 Закона РФ от 07.02.1992 N 2300-1 «О защите прав потребителей»"
  type: "material"
  enforcer: "Роспотребнадзор (КоАП 14.8 ч. 1 по PDF, стр. 9, 25)"
  remedy: "полная информация о продавце, товаре и цене до договора; при нарушении — отказ от договора, возврат, убытки через ст. 12 (стр. 25 PDF)"
  summary: "До оплаты покупатель должен видеть, у кого и что он покупает: реквизиты продавца, полную цену в рублях, условия оплаты, доставки и гарантии; итоговая цена — без «сюрпризов» на последнем шаге, а ст. 10 п. 2 задаёт полный перечень сведений о товаре."
  source_url: "http://pravo.gov.ru/proxy/ips/?docbody=&link_id=0&nd=102014512&intelsearch=&firstDoc=1"
  availability: "partial"
  consumer_redress: "Через ст. 12 ЗоЗПП (стр. 25 PDF): отказ от договора, возврат уплаченного, убытки; неполная карточка — основание для возврата даже качественного товара."
  public_enforcement: "Роспотребнадзор; административная ответственность по КоАП 14.8 ч. 1 (стр. 9, 25, 59 PDF). Суммы санкций в приложенном PDF намеренно не приведены (стр. 57)."
  private_enforcement: "Прямые требования потребителя по ст. 12: отказ от договора, возврат, убытки (стр. 25 PDF). Процессуальный порядок в приложенных источниках не описан."
  penalty_basis: "КоАП РФ, ст. 14.8 ч. 1 — нарушение права потребителя на информацию (стр. 25, 59 PDF). Размеры штрафов приложенный PDF не фиксирует: «Суммы штрафов меняются почти ежегодно, поэтому в KB храните ссылку на статью, а не число» (стр. 57)."
  non_monetary_relief: "Не установлено по приложенным источникам."
  limitations: "Работает, когда покупатель — физлицо для личных нужд; для закрытого B2B-кабинета это фильтр применимости (стр. 25 PDF). Обязательный состав карточки товара или услуги до договора — перечень на стр. 29 PDF (ст. 8–10, 26.1 ЗоЗПП; ПП № 2463). Приложенный PDF — обзор, а не официальный текст: перед релизом редакцию сверять по первоисточнику (стр. 1 PDF)."
  who_may_act: "Потребитель (ст. 12: отказ, возврат, убытки) и Роспотребнадзор (КоАП 14.8 ч. 1) — по PDF, стр. 9, 25. Иные субъекты в приложенных источниках не названы."
  adjudicator: "Не установлено по приложенным источникам."
  limitation_period: "Не установлено по приложенным источникам."
  collective_route: "Не установлено по приложенным источникам."
  non_binding_forums: "Не установлено по приложенным источникам."
  liability_source_urls: ["http://pravo.gov.ru/proxy/ips/?docbody=&link_id=0&nd=102014512&intelsearch=&firstDoc=1"]
  eligible_outcome_ids: [2024-kuibyshevsky-irk-2-339-2024, 2025-geldor-krk-2-917-2025, 2025-kraevoy-krk-33-10269-2025]
  verified_as_of: "2026-09-29"

- id: ru-zozpp-16
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Закон РФ «О защите прав потребителей», ст. 16 — недопустимые условия договора; навязывание товаров, услуг и лишних персональных данных"
  citation: "ст. 16 Закона РФ от 07.02.1992 N 2300-1 (в ред. 135-ФЗ от 01.05.2022, с 01.09.2022; дополнена ФЗ от 07.04.2025 N 69-ФЗ, с 01.09.2025)"
  type: "material"
  enforcer: "Роспотребнадзор (КоАП 14.8 по PDF, стр. 26)"
  remedy: "платные допуслуги — только активным отдельным выбором; возврат за навязанную услугу (стр. 26 PDF)"
  summary: "Платные дополнительные услуги подключаются только отдельным активным выбором покупателя: предзаполненная галочка — не согласие, отказ от допуслуги не может блокировать основную покупку, а обязательными делаются только те поля персональных данных, без которых заказ не исполнить."
  source_url: "http://pravo.gov.ru/proxy/ips/?docbody=&link_id=0&nd=102014512&intelsearch=&firstDoc=1"
  availability: "partial"
  consumer_redress: "Требование о возврате уплаченного за навязанные дополнительные товары (работы, услуги) удовлетворяется в течение трёх дней со дня предъявления — п. 3.1 ст. 16, введён ФЗ от 07.04.2025 N 69-ФЗ (сверено по действующей редакции 2026-09-30; в обзорном PDF срок стоял с пометкой «проверить», стр. 26)."
  public_enforcement: "Роспотребнадзор; КоАП 14.8 (стр. 26, 59 PDF). Суммы санкций в приложенном PDF не приведены (стр. 57)."
  private_enforcement: "Право потребителя требовать возврат за навязанную услугу (стр. 26 PDF); процессуальный порядок в приложенных источниках не описан."
  penalty_basis: "КоАП РФ, ст. 14.8 — «недопустимые условия» прямо названы в составе (стр. 59 PDF). Размеры штрафов приложенный PDF намеренно не фиксирует (стр. 57)."
  non_monetary_relief: "Не установлено по приложенным источникам."
  limitations: "B2C-фильтр применимости (стр. 25 PDF). Квалификация тёмных паттернов по PDF (стр. 30): предустановленная галочка платной услуги — запрещено; допуслуга или подписка уже в корзине — запрещено без отдельного согласия; отказ от допуслуги блокирует покупку — запрещённое обусловливание; «продолжая, вы соглашаетесь приобрести…» — нет отдельного волеизъявления, согласие не доказано (вместе с ГК 438); с 01.09.2025 запрет автоматических отметок о согласии и условий, предполагающих изначальное согласие, прямо кодифицирован в п. 3.1 ст. 16 (ФЗ N 69-ФЗ, сверено 2026-09-30). Обязанность доказать согласие лежит на продавце: по каждому согласию хранить версию экрана, состав заказа, дату и время, действие пользователя (стр. 31 PDF). Сверено по тексту статьи (ред. от 28.12.2025, evidence/law/zozpp-2300-1_st16, стр. 2–4): пп. 5 п. 2 — условия, обусловливающие приобретение одних товаров обязательным приобретением других; пп. 15 — иные условия, нарушающие правила; п. 3.1 — согласие на дополнительные товары оформляется в письменной форме или иным способом, позволяющим подтвердить волеизъявление, «проставление продавцом (исполнителем, владельцем агрегатора) автоматических … отметок о согласии» и «условий, предполагающих изначальное согласие потребителя» не допускается; возврат за навязанное — в течение трёх дней. Суды применяют именно пп. 5 и 15 п. 2 (акты G1 в evidence/enforcement)."
  who_may_act: "Потребитель и Роспотребнадзор (стр. 26 PDF). Иное не установлено по приложенным источникам."
