  instrument: "Федеральный закон от 31.07.2025 N 289-ФЗ «Об отдельных вопросах регулирования платформенной экономики в Российской Федерации» — обязанности посреднических цифровых платформ из реестра"
  citation: "ФЗ от 31.07.2025 N 289-ФЗ (принят ГД 22.07.2025; в силе с 01.10.2026, п. 1 ст. 23; реквизиты сверены 2026-09-30)"
  type: "material"
  enforcer: "Не установлено по приложенным источникам (ответственность платформ — отдельный закон 2026 г., помечен в PDF «проверить», стр. 28)"
  remedy: "по PDF (стр. 28): пометка «оператор не является продавцом» и сведения о продавце на карточке; сортировка по выбранному пользователем критерию не подменяется; скидки за счёт продавца — с уведомлением и согласием; блокировка карточки или кабинета — мотивированное уведомление, обжалование, восстановление"
  summary: "Для посреднических цифровых платформ из реестра закон задаёт поведение интерфейса: честная карточка с ролью оператора и данными продавца, сортировка без подмены выбранного пользователем критерия и равные условия платного продвижения, скидки за счёт продавца только с уведомлением и согласием, блокировки — с мотивировкой и досудебным обжалованием."
  source_url: "https://publication.pravo.gov.ru/"
  availability: "partial"
  consumer_redress: "Не установлено по приложенным источникам."
  public_enforcement: "Не установлено по приложенным источникам (штрафы для платформ — отдельный закон 2026 г., «проверить», стр. 28 PDF)."
  private_enforcement: "Не установлено по приложенным источникам (PDF называет жалобу и досудебное обжалование блокировок внутри платформы, стр. 28)."
  penalty_basis: "Не установлено по приложенным источникам."
  non_monetary_relief: "Восстановление карточки или кабинета после устранения причин блокировки (стр. 28 PDF)."
  limitations: "В силе с 01.10.2026 (п. 1 ст. 23; вступление перепроверено 2026-10-01) — оценки, датированные ранее 01.10.2026, остаются вне действия нормы, поэтому effective-date-гейт в маршруте обязателен. Применяется только к посредническим цифровым платформам, включённым в реестр (ПДФ стр. 28; наличие в реестре с экрана не видно — факт остаётся unknown). PDF сам требует «детали — сверить с текстом закона» (стр. 28); сопутствующие изменения — ФЗ от 31.07.2025 N 290-ФЗ (сверено 2026-09-30). Паттерна среди 68 нет: норма становится достижимой после принятия предложения P-04 «marketplace-sort-override»."
