  instrument: "149-ФЗ, ст. 10 (в ред. 406-ФЗ, с 01.12.2023) — авторизация российских пользователей только установленными способами"
  citation: "ст. 10 149-ФЗ (в ред. 406-ФЗ от 31.07.2023, с 01.12.2023)"
  type: "material"
  enforcer: "состав КоАП 13.55 (стр. 16 PDF: закон о составе подписан 26.06.2026)"
  remedy: "авторизация россиян — номером российского оператора, через ЕСИА, ЕБС или иную российскую ИС: убрать «Войти через Google / Apple / Facebook»; допустимы телефон, Госуслуги, VK ID, Яндекс ID, Сбер ID и аналоги (стр. 16 PDF)"
  summary: "Вход для российских пользователей работает только российскими способами: кнопки «Войти через Google/Apple/Facebook» из интерфейса уходят, остаются телефон, Госуслуги и российские ID."
  consumer_redress: "Через материальные нормы ЗоЗПП; отдельного средства PDF не называет."
  private_enforcement: "Не установлено по приложенным источникам."
  public_enforcement: "КоАП 13.55: по PDF «юрлица до 700 тыс. ₽, повторно до 1,4 млн ₽» (стр. 16 — вилка названа самим источником); дата начала действия состава — «лето 2026, проверить» (стр. 64)."
  penalty_basis: "КоАП 13.55 (стр. 16, 59 PDF; effective-date состава с меткой источника «проверить»)."
  limitations: "«Вход через LinkedIn» дополнительно не работает технически (стр. 23). Кнопка «Войти через Госуслуги» — по методическим рекомендациям, запрашивать только нужные данные (стр. 44). Уточнение по тексту 406-ФЗ (evidence/law/fz-406-2023-07-31_01-статья-1, стр. 1–2): обязанность внесена в ст. 8 ч. 10 149-ФЗ (не в ст. 10, как указывал обзорный PDF): владелец сайта/программы, предоставляющий доступ авторизованным пользователям, обязан проводить авторизацию пользователей из РФ абонентским номером оператора подвижной связи, через ЕСИА, ЕБС или иную российскую информационную систему; п. 2 ст. 1 406-ФЗ вступил в силу 01.12.2023. Административный состав — КоАП 13.55 (199-ФЗ от 26.06.2026)."
