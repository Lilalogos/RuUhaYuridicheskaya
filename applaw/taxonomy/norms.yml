# пометки обязан нести. Источник — только обзорный PDF (капсула src-0116437c998bcd82);
# «пропаганда» везде в кавычках источника; практика шире буквы фиксируется
# словами PDF; уголовные составы — только в penalty_basis.
- id: ru-state-symbols
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "ФКЗ от 25.12.2000 N 2-ФКЗ, N 1-ФКЗ, N 3-ФКЗ (герб, флаг, гимн); ГК РФ ст. 1259 п. 6 и 1483 п. 2; ПП РФ от 27.12.1995 N 1268 — использование государственных символов в интерфейсе"
  citation: "ФКЗ N 1-ФКЗ, N 2-ФКЗ, N 3-ФКЗ от 25.12.2000; ст. 1259 п. 6, ст. 1483 п. 2 ГК РФ; ПП РФ N 1268"
  type: "material"
  enforcer: "составы КоАП 17.10 (стр. 6–7 PDF); Роспатент/ФАС — по товарным знакам"
  remedy: "герб — вне коммерческого UI, не основа логотипов; флаг — допустим уважительно, без надписей поверх, глитчей и смены порядка полос; гимн — не рингтон и не ремикс; гербовые бланки и печати не имитировать в генерируемых PDF (стр. 6–7 PDF)"
  summary: "Флаг в коммерческом интерфейсе допустим при уважительном использовании, герб — только в официальном контексте госсервисов, а любое искажение госсимволов PDF называет уголовным риском; официальные изображения берутся из законов, логотипы на орле или триколоре не регистрируются и создают ложную связь с государством."
  public_enforcement: "КоАП 17.10 — нарушение порядка использования госсимволов (стр. 6–7, 59 PDF); суммы приложенный PDF не фиксирует (стр. 57)."
  private_enforcement: "Отсутствует по приложенным источникам."
  penalty_basis: "КоАП 17.10; УК 329 (надругательство над гербом и флагом) и УК 327 (при подделке гербовых бланков) — стр. 6–7 PDF; размеры санкций в источниках не приведены."
  limitations: "Допустимый контекст: сервисы госорганов по их регламентам (стр. 6). Региональные гербы — только официальные изображения, коммерческое использование часто требует разрешения администрации (стр. 7). Промо с триколором — без намёка на госодобрение (38-ФЗ ст. 5 ч. 5 п. 2, стр. 7). Дизайн «под госсервис» — риск введения в заблуждение (стр. 7)."
  source_url: "https://publication.pravo.gov.ru/"
  availability: "partial"
  consumer_redress: "Не применимо: контентная обязанность, потребительского денежного средства защиты приложенные источники не называют."
  non_monetary_relief: "Удаление или замена элемента интерфейса; для UGC — модерация (по логике раздела PDF)."
  who_may_act: "Надзорные органы по соответствующим составам КоАП (конкретный орган в приложенных источниках для этой нормы не назван)."
