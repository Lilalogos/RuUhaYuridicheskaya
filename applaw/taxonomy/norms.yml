  summary: "Интерфейс не популяризирует средства обхода блокировок: подсказки «откройте через VPN», промо-блоки и партнёрки VPN запрещены, реклама VPN — отдельный состав."
  public_enforcement: "Реклама VPN — КоАП 14.3, по PDF «до 500 тыс. ₽ для юрлиц» (стр. 13 — сумма названа самим источником); смежные составы 13.52 (владельцы VPN-сервисов) и 13.53 (стр. 13, 59)."
  penalty_basis: "КоАП 14.3; КоАП 13.52 — для владельцев VPN-сервисов; КоАП 13.53 — поиск экстремистских материалов, в т.ч. через VPN (стр. 13, 59 PDF)."
  limitations: "Составы 13.52/13.53 действуют с 01.09.2025 (стр. 13, 64 PDF). Субъект 13.52 — владелец VPN-сервиса, поэтому для обычного продукта ядро обязанности — не популяризировать и не рекламировать. Сверено по тексту ст. 5 38-ФЗ (evidence/law/fz-38-reklama_st5): ч. 10.8 запрещает рекламу программно-аппаратных средств доступа к ресурсам, доступ к которым ограничен. Практика: Вологодское УФАС 035/05/5-1030/2025 (ссылка на VPN-бот в Telegram — реклама), Хабаровское УФАС ЛИ/2865/26 (ч. 18 ст. 14.3, предупреждение) — evidence/enforcement."
