- id: ru-zozpp-16-1
  jurisdiction: "RU"
  sub_jurisdiction: null
  instrument: "Закон РФ «О защите прав потребителей», ст. 16.1 — формы оплаты; электронный отказ от использования сохранённых платёжных реквизитов (ФЗ от 15.10.2025 N 376-ФЗ)"
  citation: "ст. 16.1 Закона РФ от 07.02.1992 N 2300-1 (в ред. ФЗ от 15.10.2025 N 376-ФЗ, в силе с 01.03.2026)"
  type: "material"
  enforcer: "Роспотребнадзор (стр. 26 PDF)"
  remedy: "электронный отказ от сохранённых реквизитов и автопродления без звонка в поддержку; после отказа списания запрещены (стр. 26 PDF)"
  summary: "Пользователь должен из кабинета электронно видеть сохранённые карты, удалять карту и отключать автопродление без звонка в поддержку; после отказа от использования сохранённых реквизитов списания запрещены, дата и время отказа фиксируются, а частота и сумма списаний раскрываются до подписки."
  source_url: "http://pravo.gov.ru/proxy/ips/?docbody=&link_id=0&nd=102014512&intelsearch=&firstDoc=1"
  availability: "partial"
  consumer_redress: "После электронного отказа от использования сохранённых реквизитов дальнейшие списания запрещены (стр. 26 PDF). Отдельные денежные последствия для потребителя в приложенном PDF не описаны."
  public_enforcement: "Роспотребнадзор; КоАП 14.8 — «подписки» прямо названы в составе (стр. 26, 59 PDF). Суммы санкций PDF не фиксирует (стр. 57)."
  private_enforcement: "Не установлено по приложенным источникам."
  penalty_basis: "КоАП РФ, ст. 14.8 (стр. 59 PDF); размеры штрафов в приложенных источниках отсутствуют (стр. 57)."
  non_monetary_relief: "Не установлено по приложенным источникам."
  limitations: "Редакция о подписках: ФЗ от 15.10.2025 N 376-ФЗ, принят ГД 24.09.2025, в силе с 01.03.2026 (реквизиты сверены по официальному тексту 2026-09-30; в PDF — стр. 26, 64 без номера). Та же статья содержит обязанность принимать карту «Мир» — пороги PDF помечает «сверить» (стр. 26). Дизайн-требование PDF: разделять четыре разных действия — отмена подписки, отключение автопродления, отказ от карты, удаление платёжного средства (стр. 26). Отмена подписки только по телефону или письмом — нет электронного отказа, нарушение (стр. 31). Списания после удаления или отказа от карты — запрещено; кнопка, визуально удаляющая карту при продолжающихся списаниях, — отказ выражен действием, высокий риск (стр. 30). Сверено по тексту статьи (ред. от 28.12.2025, evidence/law/zozpp-2300-1_st16-1): п. 4.2 — при оплате услуг по абонентскому договору в сети Интернет потребитель вправе заявить отказ от использования сохранённых реквизитов, исполнитель обязан обеспечить приём отказа в электронной форме; порог обязательного приёма карт «Мир» — выручка свыше 20 млн ₽ за предшествующий год (п. 1 абз. 1), с исключениями для мест без связи и торговых объектов с выручкой до 5 млн ₽. Обязанность по цифровому рублю и равной цене при рассрочке — отдельные нормы ru-zozpp-16-1-digital-ruble и ru-zozpp-16-1-installment-price."
  who_may_act: "Потребитель и Роспотребнадзор (стр. 26 PDF). Иное не установлено по приложенным источникам."
  adjudicator: "Не установлено по приложенным источникам."
  limitation_period: "Не установлено по приложенным источникам."
