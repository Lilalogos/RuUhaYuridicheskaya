  limitations: "Категория 168-ФЗ — «информация для публичного ознакомления потребителей»; для закрытого B2B-кабинета прямое применение PDF называет спорным, публичный сайт и маркетинг — зона риска в любом случае (стр. 8). Языки республик — только как дополнительная локализация (стр. 10). Заимствования сверяются с нормативными словарями (распоряжение N 1102-р, стр. 9). Сверено по тексту ст. 10.1 ЗоЗПП (evidence/law/zozpp-2300-1_st10-1): информация для публичного ознакомления потребителей выполняется на русском языке; иноязычный текст допускается при наличии равнозначного по размещению и техническому оформлению русского текста; исключения — фирменные наименования, товарные знаки, знаки обслуживания."
