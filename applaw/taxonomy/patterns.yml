- id: fake-social-proof
  name: "Unverified social proof"
  family: pressure
  stage: lure
  severity_default: medium
  detection_cues:
    - "Экран чекаута или продающей воронки подаёт отзывы, свидетельства, рейтинги, комментарии или рекомендации как исходящие из Facebook, Instagram, LinkedIn, Trustpilot, Google Reviews, Yelp, Reddit, X, TikTok, магазина приложений или другой социальной или отзывной платформы, но доказательства подлинности не были предоставлены вместе со скриншотом."
    - "Модуль отзывов расположен рядом с предложением, ценой, CTA, выбором тарифа, элементом регистрации или шагом оплаты и существенно поддерживает решение о конверсии."
    - "Фиксируйте весь блок отзывов и его признаки источника, даже если они малы или малозаметны: логотипы или знаки платформы, звёзды, имена авторов, даты, лайки, ответы, число отзывов, стилистику платформы, значки и соседний текст об источнике. Карусель или секцию свидетельств считайте одним модулем отзывов."
    - "Логотипы клиентов, полосы компаний-заказчиков, изображения знаменитостей или рекомендации блогеров подразумевают реальных пользователей или отношения с брендом без источника, даты, признака разрешения или ссылки для проверки."
    - "Крупные числовые заявления — число отзывов, сумма пятизвёздочных оценок, обслуженные участники или доля успеха — приведены без методологии, платформы-источника, размера выборки или даты обновления."
  false_positive_traps:
    - "Не отмечать обычные иконки соцсетей в подвале; кнопки поделиться, подписаться или войти; а также логотипы платформ, не привязанные к отзыву или рекомендации."
    - "Не отмечать явно иллюстративные или реконструированные свидетельства, а также предоставленный официальный виджет или напрямую прослеживаемый источник, видимые детали которого совпадают с показанным модулем."
    - "Не отмечать обычные отзывы покупателей, которые существенно не используются для влияния на решение о покупке."
    - "Отсутствие видимо напечатанного URL на скриншоте не доказывает, что виджет некликабелен, и не устанавливает фабрикацию."
  maps_to_norms: [ru-38fz-5-3, ru-zozpp-12]

