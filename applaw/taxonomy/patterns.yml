- id: urgency-timer
  name: "Artificial urgency timer"
  family: pressure
  stage: commit
  severity_default: high
  detection_cues:
    # ru
    - "Русскоязычный сигнал: обратный отсчёт или строка дефицита вроде «осталось 2 штуки», «успейте за 10:00», «только сегодня» подталкивает к шагу покупки."
    - "Таймер обратного отсчёта, иконка часов, сообщение о скором окончании или динамичный CTA намекают, что предложение вот-вот истечёт."
    - "Сигнал срочности расположен рядом с ценой, скидкой или CTA и конкурирует с раскрытием условий подписки или отмены."
    - "Таймер сбрасывается, продлевается или выглядит типовым, а не привязанным к реальному остатку товара или сроку акции."
    - "Сокращающийся прогресс-бар, календарь с отметкой на сегодня, иконка огня или горячего предложения либо анимированный таймер усиливают ощущение скорого истечения без подтверждённого срока."
    - "Всплывающее или встроенное сообщение продлевает скидку, перезапускает таймер или сообщает, что предложение восстановлено, после того как пользователь подождал или замешкался."
  false_positive_traps:
    - "Не отмечать реальный срок или заканчивающийся остаток, когда основание достоверно, а существенные условия остаются ясными несмотря на таймер."
  maps_to_norms: [ru-38fz-5-3]

