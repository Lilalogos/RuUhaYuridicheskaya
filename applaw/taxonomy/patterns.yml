    - "Оператор отвечает Да на сгруппированный вопрос о подлинности; зафиксируйте факт дословно как operator-confirmed fake or fabricated social proof и укажите, что он не был независимо проверен."
    - "Когда подтверждённый или подтверждённый оператором модуль существенно поддерживает конверсию рядом с предложением, ценой, CTA, выбором тарифа, элементом регистрации или шагом оплаты, классифицируйте находку как High по серьёзности и заново примените обычную рубрику оценки."
  false_positive_traps:
    - "Внешний вид, стилистика платформы, статичный блок, отсутствие видимо напечатанного URL или неразрешённая подлинность не являются подтверждением фабрикации."
    - "Ответ Нет или Неизвестно не активирует этот паттерн. Ответ Нет без подтверждающей информации об источнике — это merchant-asserted genuine; not independently verified (заявлено продавцом как подлинное; независимо не проверено), и находка остаётся Unverified social proof, когда она существенна."
    - "Не отмечать явно иллюстративные или реконструированные свидетельства либо совпадающий предоставленный официальный виджет или напрямую прослеживаемый источник."
