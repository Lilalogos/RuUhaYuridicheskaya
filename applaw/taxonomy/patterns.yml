  detection_cues:
    # ru
    - "Георгиевская лента, Знамя Победы или иной символ воинской славы украшает распродажу, скидку, промобаннер либо используется как игровая механика или наградной ассет («скидки к 9 мая» в оформлении с лентой)."
  false_positive_traps:
    - "Не отмечать уважительный памятный контент без коммерческой подачи."
  maps_to_norms: [ru-victory-symbols]

- id: extremist-symbol-display
  name: "Nazi or extremist symbol displayed"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    - "Свастика, руны СС, «тотенкопф» либо надписи и знаки, сходные с ними до степени смешения, появляются в любом элементе интерфейса, стикере, аватаре, узоре или пользовательском контенте на захваченном экране."
  false_positive_traps:
    - "Не отмечать явно осуждающий исторический контекст — обзорный PDF называет игры и энциклопедии, — где сама подача осуждает символ."
  maps_to_norms: [ru-extremist-symbols]

- id: banned-platform-asset
  name: "Banned organization logo, button, or integration"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    # ru
    - "Виден логотип Instagram или Facebook (Meta), кнопка поделиться, вход «войти через Facebook», ссылка «мы в Instagram», встроенный пост, рекламное размещение или элемент пожертвования в пользу организации из списков Минюста/ФСБ."
  false_positive_traps:
    - "Не отмечать ассеты платформ, которые лишь заблокированы, но не признаны экстремистскими; их режим иной (запрет рекламы, деградированные встраивания)."
  maps_to_norms: [ru-banned-orgs-presence]

- id: banned-org-unlabeled-mention
  name: "Banned organization mentioned without its status"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Текст на экране называет организацию, признанную экстремистской, террористической или нежелательной (Instagram, Facebook, Meta, ФБК и другие из списков), без пометки о статусе вроде «организация признана экстремистской и запрещена в РФ»."
  false_positive_traps:
    - "Не отмечать упоминание, сопровождаемое видимой корректной пометкой о статусе, и не считать саму пометку одобрением."
  maps_to_norms: [ru-banned-orgs-presence]

- id: prohibited-lgbt-symbolism
  name: "Rainbow or pride symbolism displayed"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    - "Шестиполосный радужный флаг или его стилизации, прайд-символика либо образы, названные в блоке 478-ФЗ обзорного PDF, — в том числе в иллюстрациях, промо, стикерах, аватарах — появляются на захваченном экране; юридически значимое поле пола предлагает значения помимо М/Ж."
  false_positive_traps:
    - "Не отмечать несвязанный многоцветный дизайн, который не воспроизводит шестиполосную схему или прайд-символику."
  maps_to_norms: [ru-lgbt-symbolism]

- id: nonconforming-russia-map
  name: "Map or region list contradicts the 89-subject composition"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    # ru
    - "Карта, селектор региона, форма адреса, список стран или выбор телефонного кода показывает Крым, Севастополь, ДНР, ЛНР, Запорожскую или Херсонскую области либо Курилы вне Российской Федерации, рисует иную границу, или это делает сторонний картографический тайл."
  false_positive_traps:
    - "Не отмечать соответствующую карту или экраны вообще без картографического или регионального элемента."
  maps_to_norms: [ru-territorial-maps]

- id: unlabeled-foreign-agent-material
  name: "Foreign-agent material without the required label"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    - "Элемент ленты, встраивание или пользовательский пост перепубликовывает материал автора из реестра иноагентов без предписанной маркировки либо с маркировкой, которая не вдвое крупнее текста, неконтрастна или размещена не после заголовка."
  false_positive_traps:
    - "Не отмечать материал, автор которого не подтверждён как внесённый в реестр, — принадлежность к реестру никогда не видна на экране."
  maps_to_norms: [ru-foreign-agent-labeling]

- id: missing-age-label
  name: "Information product card without an age label"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Карточка приложения, игры, курса, видео или мероприятия (продукты «0+»…«18+») не показывает видимого знака возрастной категории в самой карточке, либо на баннере мероприятия знак занимает видимо меньше требуемой доли площади."
  false_positive_traps:
    - "Не отмечать обычные товары, не являющиеся информационной продукцией, и не требовать знака там, где показан лишь раздел сайта без карточек продуктов."
  maps_to_norms: [ru-age-marking]

- id: non-russian-consumer-interface
  name: "Consumer interface not in Russian or with an unequal duplicate"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Кнопки, меню, формы, cookie-баннер, карточки товаров или текст оферты публичного потребительского интерфейса не на русском языке, русский не на первом месте, либо иноязычный дубликат видимо слабее по цвету, шрифту или размеру («Checkout», «Sign in» как единственные подписи)."
  false_positive_traps:
    - "Не отмечать зарегистрированные товарные знаки и названия компаний из ЕГРЮЛ, оставленные без перевода, а также дополнительные локализации на языках республик, предлагаемые наряду с русским."
  maps_to_norms: [ru-interface-language]

# Контентные паттерны, волна 2
- id: vpn-promotion
  name: "VPN promotion or bypass hint"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Интерфейс предлагает обойти блокировки или продвигает VPN: «откройте через VPN», «работает с VPN», промоблок VPN, партнёрская ссылка или рекламное размещение VPN."
  false_positive_traps:
    - "Не отмечать нейтральное техническое упоминание VPN в настройках сетевого продукта без продвижения или подачи как способа обхода."
  maps_to_norms: [ru-vpn-promotion-ban]

- id: drug-symbol-display
  name: "Drug symbolism in visual elements"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    - "Лист каннабиса или иная наркотическая символика появляется в иконках, узорах, стикерах, мемах или пользовательском контенте на захваченном экране."
  false_positive_traps:
    - "Не натягивать обобщённые ботанические образы на наркотическую символику без узнаваемого листа или наркотической подачи."
  maps_to_norms: [ru-drug-symbols]

- id: religious-symbol-in-promo
  name: "Religious symbol in a joking or promo context"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Религиозный символ появляется в промоиллюстрациях, мемах, стикерах или шутках — кресты, иконы, полумесяцы и подобное используются как панчлайн или декор распродажи («распродажа грехов», гэги на основе символов)."
  false_positive_traps:
    - "Не отмечать нейтральное или уважительное изображение религиозных предметов в редакционном или каталожном контенте."
  maps_to_norms: [ru-religious-symbols-promo]

- id: undesirable-org-embed
  name: "Undesirable-organization material embedded"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    - "Экран встраивает материал организации из перечня нежелательных организаций Минюста или ссылается на неё — встроенная статья, виджет, рекомендованная ссылка."
  false_positive_traps:
    - "Не отмечать организации вне перечня; принадлежность к перечню никогда не видна на экране и должна быть подтверждена."
  maps_to_norms: [ru-undesirable-orgs]

- id: missing-complaint-control
  name: "Social-network content object without a complaint control"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "В ленте или на странице социальной сети объекты контента — посты, комментарии, видео — не имеют элемента «Пожаловаться», либо монетизация работает на страницах, которые должны находиться вне ограничений реестра."
  false_positive_traps:
    - "Не отмечать сервисы, которые не являются социальными сетями или находятся ниже установленного законом порога аудитории, — порог никогда не виден на экране."
  maps_to_norms: [ru-social-network-duties]

- id: missing-adult-gate
  name: "18+ section without an access barrier"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    # ru
    - "Раздел с запрещённым для детей контентом открывается без возрастного барьера: барьера нет вовсе, превью не размыты, небезопасный поиск по умолчанию; либо единственная мера — голая кнопка «Мне есть 18», поданная как достаточная."
  false_positive_traps:
    - "Не требовать барьера там, где раздел с запрещённым для детей контентом не показан."
  maps_to_norms: [ru-child-access-barriers]

- id: missing-media-imprint
  name: "Registered media page without imprint"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "На странице зарегистрированного сетевого СМИ отсутствуют выходные данные — название, учредитель, редактор, свидетельство о регистрации — или знак «18+» на странице."
  false_positive_traps:
    - "Не отмечать обычные сайты без регистрации СМИ; статус никогда не виден на экране и должен быть подтверждён."
  maps_to_norms: [ru-media-imprint]

# Паттерны волны 3a
- id: ad-disguised-as-organic
  name: "Ad presented as an organic item"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    # ru
    - "Платное размещение выглядит как органическая карточка или пост: нет слова «Реклама», нет рекламодателя, нет токена erid; нативная интеграция или пометка «партнёрский материал» подменяет требуемую маркировку; платные позиции в поиске или подборках не несут рекламной пометки."
  false_positive_traps:
    - "Не отмечать размещения, которые видимо несут «Реклама», рекламодателя (или ссылку на него) и токен erid."
  maps_to_norms: [ru-38fz-18-1]

- id: promo-rules-missing
  name: "Promo banner without terms and organizer"
  family: disclosure
  stage: lure
  severity_default: medium
  detection_cues:
    # ru
    - "Баннер розыгрыша, колеса скидок, подарка или промокода не показывает ни сроков, ни организатора, ни ссылки на полные правила."
  false_positive_traps:
    - "Не отмечать простые прайс-листы, не являющиеся стимулирующей акцией."
  maps_to_norms: [ru-38fz-9]

- id: unsubscribe-link-missing
  name: "Marketing message without an unsubscribe link"
  family: consent
  stage: charge
  severity_default: medium
  detection_cues:
    # ru
    - "Рекламное письмо, SMS или push не содержит ссылки «отписаться» или работающего отказа, либо согласие на рекламу находится внутри чекбокса о персональных данных вместо собственного непроставленного чекбокса «получать рекламу»."
  false_positive_traps:
    - "Не отмечать транзакционные сообщения (чеки, доставка), не являющиеся рекламой."
  maps_to_norms: [ru-38fz-18, ru-152fz-15]

- id: privacy-policy-link-missing
  name: "Data form without a policy link"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    # ru
    - "Форма, собирающая персональные данные, не показывает рядом ссылку на политику обработки («Политика обработки персональных данных»)."
  false_positive_traps:
    - "Судите только по показанным экранам; политика может правомерно находиться в подвале вне захвата — тогда факт неизвестен, а не отсутствует."
  maps_to_norms: [ru-152fz-18-1]

- id: consent-withdrawal-obstructed
  name: "Consent withdrawal or account deletion obstructed"
  family: cancellation
  stage: block
  severity_default: medium
  detection_cues:
    # ru
    - "Настройки не дают пути «отозвать согласие» или «удалить аккаунт», либо отзыв требует писем, звонков или шагов, намного более тяжёлых, чем было согласие в один клик."
  false_positive_traps:
    - "Короткое подтверждение личности перед удалением не является препятствованием."
  maps_to_norms: [ru-152fz-withdrawal]

- id: no-automated-decision-recourse
  name: "Automated decision without explanation or appeal"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    # ru
    - "Результат скоринга, автоматический отказ или лимит с юридическими последствиями показан без экрана объяснения и работающего элемента «оспорить», ведущего к рассмотрению человеком."
  false_positive_traps:
    - "Чистые рекомендации без юридических последствий относятся к обязанности уведомлять о рекомендательных технологиях, а не сюда."
  maps_to_norms: [ru-152fz-16]

- id: biometric-only-login
  name: "Biometric login without an alternative"
  family: consent
  stage: commit
  severity_default: high
  detection_cues:
    - "Вход по лицу или голосу — единственный путь входа, без альтернативного способа и без отдельного флоу согласия в письменной форме."
  false_positive_traps:
    - "Не отмечать биометрию, предлагаемую наряду с альтернативой в виде пароля или кода и с собственным согласием."
  maps_to_norms: [ru-152fz-11-biometric]

- id: receipt-destination-missing
  name: "Payment step without a receipt destination"
  family: disclosure
  stage: charge
  severity_default: medium
  detection_cues:
    # ru
    - "Шаг онлайн-оплаты собирает данные карты без поля «Куда прислать чек» (телефон или e-mail) перед элементом «Оплатить»."
  false_positive_traps:
    - "Не отмечать флоу, где адрес для чека был получен ранее и видимо повторён на шаге оплаты."
  maps_to_norms: [ru-54fz-receipt]

- id: missing-owner-identity
  name: "No owner identity on the site"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Захваченные страницы нигде не показывают сведений о владельце — ни наименования, ни ИНН/ОГРН, ни контактов в подвале или блоке «о нас»."
  false_positive_traps:
    - "Судите только по показанному; сведения могут находиться на странице вне захвата — тогда факт неизвестен, а не отсутствует."
  maps_to_norms: [ru-149fz-10-2, ru-zozpp-10]

- id: foreign-sso-only
  name: "Login limited to foreign SSO"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    # ru
    - "Вход предлагает «Войти через Google», «Sign in with Apple» или «Continue with Facebook», тогда как ни одного российского способа — телефон, Госуслуги, VK ID, Яндекс ID, Сбер ID — нет."
  false_positive_traps:
    - "Иностранный SSO рядом с работающими российскими способами — более слабый факт; зафиксируйте его, но запретительная строка обзорного PDF на уровне экрана нацелена на отсутствие российского пути."
  maps_to_norms: [ru-149fz-10-auth]

- id: missing-recsys-notice
  name: "Personalized feed without the recommender notice"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Персонализированные блоки — «Подобрано для вас», «Вам может понравиться», умная сортировка — работают, тогда как уведомление «применяются рекомендательные технологии» со ссылкой на правила не видно на показанных экранах."
  false_positive_traps:
    - "Редакционные, неперсонализированные подборки уведомления не требуют; одно лишь отсутствие на показанных экранах оставляет факт неизвестным для всего ресурса."
  maps_to_norms: [ru-149fz-10-2-2]

- id: personalized-price-discrimination
  name: "Identity-linked price difference"
  family: pressure
  stage: lure
  severity_default: medium
  detection_cues:
    # ru
    - "Один и тот же тариф или SKU показывает разную цену, привязанную к личности или истории зрителя: «Цена для вас», «для новых — 199 ₽» рядом с видимым входом в аккаунт либо показанное сравнение двух цен."
  false_positive_traps:
    - "Опубликованные правила программы лояльности, введённые пользователем промокоды и явное региональное ценообразование не являются дискриминацией по личности."
  maps_to_norms: [ru-gk-426]

- id: cookie-single-accept
  name: "Cookie banner with a lone Accept"
  family: consent
  stage: commit
  severity_default: low
  detection_cues:
    # ru
    - "Cookie-баннер предлагает единственную активную кнопку «Принять»/«ОК» без отказа или настроек либо опирается на «Продолжая пользоваться сайтом, вы соглашаетесь…» как на единственный механизм."
  false_positive_traps:
    - "Равноправные варианты Принять/Отклонить или чисто информационное уведомление без подачи как согласия допустимы; этот паттерн ограничен уровнем риска — обзорный PDF указывает, что прямой нормы нет."
  maps_to_norms: [ru-152fz-9]

# Паттерны волны 3b
- id: psk-frame-missing
  name: "Credit offer without the PSK frame"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    # ru
    - "Экран предложения потребительского кредита или займа не показывает полную стоимость кредита в квадратной рамке в правом верхнем углу первого экрана, прописными буквами, самым крупным шрифтом."
  false_positive_traps:
    - "Некредитным продуктам рамка не нужна; обязанность относится к кредитной вертикали."
  maps_to_norms: [ru-353fz-psk-frame]

- id: credit-addon-not-separate-application
  name: "Credit add-on without a separate application"
  family: upsell
  stage: commit
  severity_default: high
  detection_cues:
    # ru
    - "Страховка или иная платная допуслуга к кредиту подключается без собственного заявления с ценой и правом отказа — лишь заранее проставленная галочка или строка в общем пакете в кредитном флоу."
  false_positive_traps:
    - "Допуслуга, оформленная через собственное явное заявление с указанной ценой и правом отказа, соответствует требованиям."
  maps_to_norms: [ru-353fz-7-addons-cooling, ru-zozpp-16]

- id: crypto-payment-offered
  name: "Crypto offered as payment to Russian clients"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    # ru
    - "Чекаут предлагает российским клиентам «оплата криптовалютой» как способ оплаты."
  false_positive_traps:
    - "Информационный контент о криптовалюте без предложения оплаты вне охвата."
  maps_to_norms: [ru-259fz-no-crypto]

- id: foreign-messenger-contact
  name: "Regulated entity contacts via a foreign messenger"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Банк, оператор связи, государственное учреждение, крупный агрегатор или маркетплейс предлагает «написать нам в WhatsApp» или уведомляет клиентов через иностранный мессенджер."
  false_positive_traps:
    - "Обычные компании вне регулируемого перечня не охвачены."
  maps_to_norms: [ru-antifraud-foreign-messengers]

- id: missing-landing-feedback-form
  name: "Large foreign resource without the RF feedback form"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    - "Крупный иностранный ресурс нигде на показанных страницах не показывает форму обратной связи для граждан России."
  false_positive_traps:
    - "Владение и порог суточной аудитории в 500 тысяч никогда не видны на экране — оба должны быть подтверждены."
  maps_to_norms: [ru-236fz-landing]

- id: eform-loses-input
  name: "Government e-form loses entered data"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    # ru
    - "Форма государственной услуги стирает введённые данные при ошибке или возврате назад, не предлагает черновика, шага назад, загрузки файла или автозаполнения из профиля."
  false_positive_traps:
    - "Коммерческие формы вне этой обязанности (хотя та же потеря данных может подпитывать паттерны давления)."
  maps_to_norms: [ru-pp-236-eforms]

- id: error-color-only
  name: "Form error indicated by color alone"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    # ru
    - "Форма помечает невалидное поле только цветом — красная рамка без текстового сообщения, называющего поле и проблему."
  false_positive_traps:
    - "Цвет плюс видимое текстовое сообщение соответствует требованиям."
  maps_to_norms: [ru-pp-102-a11y, ru-gost-52872]

- id: accessibility-breakage
  name: "Government interface fails the accessibility baseline"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    - "На государственном сайте или в приложении: масштабирование текста до 200% ломает функции, движущийся контент нельзя остановить, вспышки чаще трёх в секунду или контраст видимо не выдержан."
  false_positive_traps:
    - "Для бизнес-продуктов вне ссылки в договоре базовый уровень — лучшая практика, а не обязанность."
  maps_to_norms: [ru-pp-102-a11y, ru-gost-52872]

- id: missing-captions
  name: "Service audio or video without captions"
  family: content
  stage: display
  severity_default: low
  detection_cues:
    - "Аудио или видео об услугах населению воспроизводится без субтитров и без текстовой расшифровки рядом."
  false_positive_traps:
    - "Развлекательные или маркетинговые медиа вне информации об услугах — зона рекомендации."
  maps_to_norms: [ru-181fz-15-captions]

- id: ai-output-rights-missing
  name: "AI feature without output-rights terms"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    # ru
    - "Функция генерации создаёт контент, тогда как показанные условия не содержат раздела «кому принадлежит сгенерированное» и пользователь не видит информации о правах."
  false_positive_traps:
    - "Судите только по показанным условиям; раздел о правах в другом месте оставляет факт неизвестным."
  maps_to_norms: [ru-ai-generation-rights]

- id: unconsented-person-photo
  name: "Identifiable person shown without consent"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    - "Фото или видео идентифицируемого человека — сотрудника, клиента, героя UGC — используется в продукте, при этом отсутствие согласия подтверждено."
  false_positive_traps:
    - "Согласие никогда не видно на экране: без подтверждения факт остаётся неизвестным; публичные мероприятия и позирование за плату — исключения по обзорному PDF."
  maps_to_norms: [ru-gk-152-1-likeness]

- id: brand-style-imitation
  name: "Competitor's trade dress imitated"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    - "Интерфейс воспроизводит фирменный стиль конкретного конкурента — цветовую систему, вёрстку, нейминг, — создавая ложное впечатление аффилированности, при этом имитируемая цель подтверждена."
  false_positive_traps:
    - "Общие конвенции категории не являются имитацией; без подтверждённой цели факт остаётся неизвестным."
  maps_to_norms: [ru-135fz-style-imitation]

- id: child-section-unfiltered
  name: "Children's section carries prohibited content"
  family: content
  stage: display
  severity_default: high
  detection_cues:
    - "Раздел или продукт, ориентированный на детей, показывает контент из запрещённого перечня, либо детский UGC работает без видимой модерации и фильтрации."
  false_positive_traps:
    - "Продукты для общей аудитории регулируются вместо этого обязанностями о знаке возрастной категории и барьере."
  maps_to_norms: [ru-436fz-child-sections]

- id: child-ad-pressure
  name: "Child-directed ad pressures or shames"
  family: pressure
  stage: lure
  severity_default: medium
  detection_cues:
    # ru
    - "Креатив, адресованный детям, говорит «попроси родителей купить», стыдит ребёнка за отсутствие продукта или нагнетает срочность на детскую аудиторию."
  false_positive_traps:
    - "Срочность, адресованная взрослым, относится к общему рекламному маршруту; пункт о таймере для детей — рекомендация обзорного PDF и ограничивается соответственно."
  maps_to_norms: [ru-38fz-6-child-ads]

- id: visible-security-gap
  name: "User-visible security measure missing"
  family: content
  stage: display
  severity_default: medium
  detection_cues:
    # ru
    - "Поле пароля показывает ввод открытым текстом (без маскирования), неудачные входы видимо не ограничены, нет сведений о предыдущем входе или блокировки по неактивности там, где задействованы персональные данные, — перечень видимых в UI мер по обзорному PDF (коды ИАФ/УПД, «сверить»)."
  false_positive_traps:
    - "Намеренный переключатель показа пароля не является снятием маскирования; коды мер несут пометку «сверить» из обзорного PDF."
  maps_to_norms: [ru-fstek-ui-measures]
