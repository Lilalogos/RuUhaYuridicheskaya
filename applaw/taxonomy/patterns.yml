# Форк только для РФ: указатели example_cases на удалённый корпус дел US/EU/UK
# убраны; примеры экранов РФ появятся с первой gold-партией.
- id: hidden-renewal
  name: "Hidden auto-renewal"
  family: disclosure
  stage: hide
  severity_default: high
  detection_cues:
    - "Цена продления, периодичность продления, крайний срок отмены или списание после пробного периода даны мелким шрифтом, приглушённым цветом, во всплывающей подсказке, в свёрнутом блоке или ниже основной цены."
    - "Экран подаёт предложение как разовую, дневную, пробную, скидочную или краткосрочную цену, тогда как периодическое списание визуально слабее."
    - "Пользователь может дойти до ввода платёжных данных раньше, чем условия периодического списания будут показаны с заметностью, сопоставимой с ценой покупки."
  false_positive_traps:
    - "Не отмечать, когда цена, периодичность продления, дата списания и крайний срок отмены расположены рядом с CTA или платёжными элементами, изложены ясным, читаемым, простым языком до ввода платёжных данных."
  maps_to_norms: [ru-zozpp-10, ru-zozpp-16-1, ru-gk-oferta]

- id: delayed-price-disclosure
  name: "Delayed price disclosure"
  family: disclosure
  stage: hide
  severity_default: high
  detection_cues:
    # ru
    - "Русскоязычный сигнал: флоу сначала требует усилий или контактов — «Пройдите тест», «Укажите почту», — а цена в рублях появляется только после этого."
    - "Воронка просит пользователя ответить на опрос, загрузить файл, отредактировать контент или оставить контактные данные до показа какой-либо цены."
    - "Существенные условия о цене или подписке впервые появляются только после того, как пользователь вложил усилия в задачу или персонализированный результат."
  false_positive_traps:
    - "Не отмечать бесплатный ознакомительный шаг, когда следующий коммерческий шаг ясно объявляет цену и условия подписки до сбора платёжных данных."
  maps_to_norms: [ru-zozpp-10]

- id: mandatory-fee-drip-pricing
  name: "Mandatory-fee drip pricing"
  family: disclosure
  stage: charge
  severity_default: high
  detection_cues:
    # ru
    - "Русскоязычный сигнал: «сервисный сбор», «комиссия» или иной обязательный платёж впервые появляется в строке «Итого» на более позднем шаге, тогда как предыдущие экраны показывали меньшую цену."
    - "Обязательный сервисный, бронировочный, процессинговый, платёжный, доставочный, платформенный или подобный сбор не включён в первоначальную заявленную цену или первое приглашение к покупке."
    - "Полная неизбежная цена появляется только после того, как пользователь выбрал товары, ввёл данные или дошёл до более позднего шага чекаута или оплаты."
    - "Сбор формально показан где-то, но отделён от первоначальной цены или включён в итог только после предшествующих шагов вовлечения."
    - "НДС, налог с продаж или иной обязательный государственный платёж добавляется только в более поздний итог или чек, тогда как заявленная цена или цена на карточке тарифа не указывает, что она без учёта налога."
  false_positive_traps:
    - "Не отмечать необязательные допуслуги, которые не предвыбраны и ясно оценены до принятия."
    - "Не отмечать неизбежные сборы, когда заявленная цена или первое приглашение к покупке уже включает полную сумму к оплате."
  maps_to_norms: [ru-zozpp-10]

- id: small-print-renewal
  name: "Small-print renewal terms"
  family: disclosure
  stage: hide
  severity_default: high
  detection_cues:
    - "Условия продления даны самым мелким текстом на экране или имеют существенно меньший визуальный вес, чем цена, скидка или CTA."
    - "Формулировки о периодическом списании помещены в юридический текст, подвал или узкую строку, которую легко пропустить при оплате."
    - "Существенный текст о продлении, сборе или подписке низкоконтрастен: например, серый текст на сером фоне, ниже контраста WCAG AA для обычного текста 4.5:1 или существенно ниже контраста заявленной цены или CTA."
  false_positive_traps:
    - "Не отмечать лишь потому, что юридические условия мельче, если ключевая цена продления, периодичность и крайний срок отмены также заметно повторены рядом с действием покупки."
    - "Не считать коэффициент контраста сам по себе достаточным, когда существенные условия расположены рядом, читаемы и визуально сопоставимы с действием покупки."
  maps_to_norms: []

- id: renewal-price-mismatch
  name: "Renewal price mismatched to purchased plan"
  family: disclosure
  stage: charge
  severity_default: high
  detection_cues:
    - "Цена продления, периодического списания или итоговая цена, указанная мелким шрифтом, на шаге подтверждения, в тексте условий или в отдельном блоке раскрытия, не равна цене тарифа, уровня или срока, который пользователь фактически выбрал или который показан на карточке тарифа."
    - "Цена экономии, сравнения или «старая» цена, используемая для обоснования скидки, не соответствует ни одной цене, фактически списываемой или предлагаемой в другом месте экрана."
  false_positive_traps:
    - "Не отмечать, когда расхождение полностью объясняется раскрытой разовой скидкой, пропорциональным перерасчётом, налогом или конвертацией валюты, ясно указанными рядом с обеими цифрами."
    - "Не отмечать расхождения округления в копейку или меньше, а также просто отсутствующую цену продления (для этого используйте hidden-renewal или small-print-renewal)."
  maps_to_norms: [ru-zozpp-12]

- id: below-fold-disclosure
  name: "Below-fold disclosure"
  family: disclosure
  stage: hide
  severity_default: high
  detection_cues:
    - "Существенная информация о подписке, продлении, отмене или сборе расположена ниже видимой области экрана, тогда как CTA находится выше неё."
    - "Пользователь может отправить форму или перейти к оплате, не прокручивая до блока раскрытия."
  false_positive_traps:
    - "Не отмечать, когда страница принудительно показывает раскрытие, требует активного подтверждения после того, как оно стало видимым, или повторяет существенные условия на первом экране."
  maps_to_norms: [ru-zozpp-10]

- id: daily-price-framing
  name: "Daily price framing"
  family: disclosure
  stage: hide
  severity_default: medium
  detection_cues:
    - "Экран подчёркивает сумму в день, тогда как фактический расчётный период и полная сумма периодического списания менее заметны."
    - "Пользователь видит низкую дневную цену рядом с CTA, но должен вчитываться в мелкий текст, чтобы понять месячное, квартальное или годовое списание."
  false_positive_traps:
    - "Не отмечать, когда дневной эквивалент вторичен, а реальная сумма списания, расчётный период и периодичность продления столь же или более заметны."
  maps_to_norms: []

- id: nominal-price-framing
  name: "Nominal entry-price framing"
  family: disclosure
  stage: hide
  severity_default: high
  detection_cues:
    - "Очень низкая цена доступа подаётся как основная, тогда как последующая цена периодической подписки менее заметна."
    - "Текст намекает на небольшую разовую плату за задачу, хотя принятие предложения запускает более высокое периодическое списание."
  false_positive_traps:
    - "Не отмечать, когда номинальная цена явно обозначена как вводная цена подписки, а последующая сумма продления показана рядом с ней."
  maps_to_norms: []

- id: one-time-price-framing
  name: "One-time price framing"
  family: disclosure
  stage: charge
  severity_default: high
  detection_cues:
    - "Подтверждение оплаты или форма выделяют только немедленное списание, создавая впечатление разовой покупки."
    - "Условия периодического списания отсутствуют или визуально отделены от финального действия оплаты."
  false_positive_traps:
    - "Не отмечать действительно разовый продукт или чекаут подписки, который ясно обозначает немедленное списание как часть автопродлеваемого тарифа."
  maps_to_norms: []

- id: trial-framing
  name: "Trial-first subscription framing"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Пробный период, расклад или короткий начальный опыт подаётся как основная покупка, тогда как платное продление приглушено."
    - "Экран побуждает пользователя начать сейчас, не придавая равной заметности тому, что произойдёт после пробного периода."
  false_positive_traps:
    - "Не отмечать, когда пробный период автоматически завершается без списания или когда условия перехода на платный тариф ясны и заметны до регистрации."
  maps_to_norms: [ru-zozpp-26-1]

- id: trial-price-framing
  name: "Trial price framing"
  family: disclosure
  stage: commit
  severity_default: high
  detection_cues:
    - "Пользователь выбирает или видит пробную цену, тогда как последующая регулярная цена слабее, скрыта или отделена от выбора."
    - "Страница подаёт пробную цену как полное экономическое решение, несмотря на автоматический переход на платный тариф."
  false_positive_traps:
    - "Не отмечать, когда регулярная цена после пробного периода и крайний срок отмены расположены рядом с каждым вариантом пробной цены."
  maps_to_norms: []

- id: misleading-trial-period
  name: "Misleading trial period"
  family: disclosure
  stage: hide
  severity_default: high
  detection_cues:
    - "Видимая длительность пробного периода больше или проще, чем фактический крайний срок отмены или момент списания."
    - "Экран говорит, что у пользователя есть указанное число дней, но мелкий шрифт требует отменить раньше, чтобы избежать списания."
  false_positive_traps:
    - "Не отмечать, когда длительность пробного периода, дата списания и последняя дата отмены указаны вместе простым языком."
  maps_to_norms: [ru-zozpp-12, ru-zozpp-26-1]

- id: payment-without-renewal-disclosure
  name: "Payment step without renewal disclosure"
  family: disclosure
  stage: charge
  severity_default: high
  detection_cues:
    - "Платёжное окно, шторка кошелька или форма карты могут быть отправлены без показа условий автопродлеваемой подписки."
    - "Платёжная поверхность показывает только выбранную цену или название продукта, опуская периодичность продления, сумму или условия отмены."
  false_positive_traps:
    - "Не отмечать, когда сама платёжная поверхность или обязательный непосредственно предшествующий шаг проверки ясно показывает условия периодического списания до авторизации платежа."
  maps_to_norms: [ru-zozpp-16-1, ru-zozpp-10, ru-gk-oferta]

- id: payment-without-clear-disclosure
  name: "Payment without clear material disclosure"
  family: consent
  stage: charge
  severity_default: high
  detection_cues:
    # ru
    - "Русскоязычный сигнал: шаг оплаты показывает поля карты и «Оплатить», тогда как полный итог в рублях или ключевые условия находятся в другом месте или ниже первого экрана."
    - "Пользователь может оплатить, тогда как существенные условия даны лишь в слабом, удалённом, противоречивом или трудночитаемом тексте раскрытия."
    - "Кнопки экспресс-чекаута, карты или оплаты доминируют на экране, тогда как ключевые условия списания не представлены как часть платёжного решения."
    - "Юридически существенные условия выделены в основном цветом или мелким шрифтом, тогда как платёжные элементы используют более сильный размер, контраст, цвет или анимацию."
  false_positive_traps:
    - "Не отмечать, когда пользователь должен просмотреть существенные условия в ясной сводке и явно согласиться до того, как платёж может быть отправлен."
  maps_to_norms: [ru-zozpp-10]

- id: email-before-price
  name: "Email gate before price"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    - "Воронка запрашивает адрес электронной почты для получения результатов, файлов или рекомендаций до показа цены."
    - "Запрос почты появляется после затраченных на задачу усилий, из-за чего следующий платный шаг воспринимается как продолжение, а не как отдельное решение о покупке."
  false_positive_traps:
    - "Не отмечать отдельную рассылку, шаг создания аккаунта или функцию сохранения прогресса, когда за ними не следует скрытое давление к покупке."
  maps_to_norms: [ru-zozpp-10]

- id: free-claim
  name: "Free claim contradicted by paid funnel"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Реклама или текст лендинга говорит, что продукт, задача или загрузка бесплатны, но воронка позже требует оплаты или запускает подписку."
    - "Пользователь вкладывает усилия под впечатлением бесплатного использования до появления цены или условий подписки."
  false_positive_traps:
    - "Не отмечать, когда экран ясно отделяет бесплатные функции от платных до того, как пользователь начнёт платную задачу."
  maps_to_norms: [ru-38fz-5-3, ru-zozpp-12]

- id: money-back-misdirection
  name: "Money-back guarantee misdirection"
  family: disclosure
  stage: commit
  severity_default: medium
  detection_cues:
    - "Гарантия, значок возврата денег или заявление об отсутствии риска оформлены визуально сильнее, чем ограничения по продлению, отмене или праву на возврат."
    - "Обещание возврата размещено рядом с CTA, тогда как оговорки малы, удалены, отсутствуют или отложены."
  false_positive_traps:
    - "Не отмечать, когда объём возврата, срок, исключения и порядок обращения ясно указаны до покупки."
  maps_to_norms: [ru-zozpp-26-1, ru-zozpp-12]

- id: health-adjacent-claim
  name: "Health-adjacent benefit claim"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Воронка использует заявления о здоровье, психическом состоянии, фитнесе, медицине, когнитивных способностях или улучшении тела, чтобы усилить ощущение потребности."
    - "Обещания, связанные со здоровьем, появляются до ясной цены или условий продления и влияют на решение о покупке."
  false_positive_traps:
    - "Не отмечать нейтральные описания категории или обоснованные заявления, которые содержат существенные ограничения и не связаны со скрытым списанием."
  maps_to_norms: []

- id: authority-claim
  name: "Authority-based claim"
  family: disclosure
  stage: lure
  severity_default: medium
  detection_cues:
    - "Экран апеллирует к экспертам, науке, психологии, институтам или профессиональному авторитету для подтверждения ценности продукта."
    - "Апелляция к авторитету поддерживает решение о покупке, тогда как подтверждение, квалификация или ограничения отсутствуют или слабы."
  false_positive_traps:
    - "Не отмечать, когда ссылка на авторитет конкретна, проверяема, должным образом оговорена и не используется для отвлечения от существенных условий."
  maps_to_norms: [ru-38fz-5-3, ru-162fz-26]

- id: outcome-promise
  name: "Outcome promise"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Страница предсказывает конкретное улучшение, трансформацию или результат, если пользователь купит или будет следовать плану."
    - "Обещанный результат используется как драйвер покупки, тогда как существенные ограничения, доказательства или типичность отсутствуют."
  false_positive_traps:
    - "Не отмечать, когда утверждение явно носит мотивационный характер или подкреплено заметными ограничениями и доказательствами."
  maps_to_norms: [ru-38fz-5-3]

- id: outcome-teaser
  name: "Outcome teaser"
  family: disclosure
  stage: lure
  severity_default: medium
  detection_cues:
    - "Пользователю сообщают, что личный результат, балл, архетип или ответ готов, но он не может увидеть содержательный вывод, не продолжив движение к оплате."
    - "Тизер подразумевает уникально личный инсайт, скрывая при этом коммерческие условия."
  false_positive_traps:
    - "Не отмечать, когда тизер — явно неперсональное развлечение или цена раскрыта до того, как пользователь вложит значительные усилия."
  maps_to_norms: [ru-38fz-5-3]

- id: tailored-plan-claim
  name: "Tailored-plan claim"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Экран заявляет, что план подобран под личные ответы, параметры тела, возраст, цели или предпочтения."
    - "Заявление о подборе центрально для ценностного предложения, но основание, ограничения или типовой характер плана не объяснены."
  false_positive_traps:
    - "Не отмечать, когда кастомизация реальна, конкретна и не используется для отсрочки или ослабления раскрытия цены и продления."
  maps_to_norms: [ru-zozpp-12]

- id: fake-analysis
  name: "Simulated analysis"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Полоса загрузки, анимация анализа или экран обработки заявляет, что анализирует ответы, файлы, данные профиля или образа жизни."
    - "Анализ выглядит типовым, фиксированным или непроверяемым, при этом усиливая ощущение персонализации до оплаты."
  false_positive_traps:
    - "Не отмечать, когда система действительно выполняет раскрытый анализ и не использует анимацию для сокрытия коммерческих условий."
  maps_to_norms: [ru-zozpp-12]

- id: false-personalization
  name: "False personalization"
  family: disclosure
  stage: lure
  severity_default: high
  detection_cues:
    - "Результат или рекомендация подаются как личные, хотя тот же негативный или подталкивающий к покупке вывод появляется независимо от введённых данных."
    - "Ответы, фотографии или данные профиля пользователя отражаются обратно в основном для создания доверия или срочности, а не содержательной кастомизации."
  false_positive_traps:
    - "Не отмечать реальную персонализацию, которая объяснена, ограничена и не сопровождается скрытыми коммерческими условиями."
