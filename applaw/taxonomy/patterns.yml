  false_positive_traps:
    - "Не использовать этот паттерн, когда подлинность лишь не разрешена; вместо него используйте Unverified social proof (неподтверждённое социальное доказательство)."
    - "Не отмечать предоставленный официальный виджет или напрямую прослеживаемый источник, у которого совпадают видимый текст, рейтинг, дата, данные автора, идентификатор платформы и другие существенные признаки."
