  false_positive_traps:
    - "Не отмечать, когда каждое существенное списание или периодическая функция раскрыты по отдельности и пользователь может принять или отклонить каждую независимо."
  maps_to_norms: [ru-zozpp-16, ru-152fz-9, ru-152fz-15, ru-38fz-18]

- id: prechecked-paid-option
