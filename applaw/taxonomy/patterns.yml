  family: consent
  stage: commit
  severity_default: high
  detection_cues:
    # ru
    - "Русскоязычный сигнал: платная допуслуга вроде «Защита покупки», «Страхование заказа» или «СМС-информирование» приходит с заранее проставленной галочкой или включённой по умолчанию."
    - "Платная допуслуга, пожертвование, страховой продукт, гарантия, план поддержки или подписка выбраны по умолчанию."
