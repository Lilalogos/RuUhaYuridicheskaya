# ru-only форк: RU-гейты плюс универсальные гейты, которые используют RU-маршруты.
# Формулировки сигналов передаются Экзаменатору дословно.

- id: post-contract-cancellation
  name: "Cancellation after the contract exists"
  detect:
    - "Экран касается прекращения уже действующей подписки: флоу отмены, удерживающее предложение или предложение понизить тариф, страница управления подпиской либо подтверждение, что тариф активен."
  avoid:
    - "Экран до покупки, а также запрос возврата по разовой покупке, за которой не стоит подписка."

- id: material-pricing-term-omitted-or-subordinated-at-invitation
  name: "Material pricing term missing or subordinated at the offer"
  detect:
    - "Итоговая цена, цена продления, периодичность списаний или условия перехода с пробного периода на платный отсутствуют, находятся ниже первого экрана, спрятаны за ссылкой или заметно менее выделены, чем продвигаемая цена, на экране, который приглашает к покупке."
  avoid:
    - "Все эти условия присутствуют и читаемы рядом с продвигаемой ценой."

- id: express-opt-in-action-required
  name: "Express opt-in required for the extra"
  detect:
    - "Потребитель должен совершить отдельное утвердительное действие, чтобы добавить допуслугу: неотмеченная галочка, явная кнопка «добавить», осознанный выбор без значения по умолчанию."
  avoid:
    - "Предотмеченная галочка, предвыбранный пакет или допуслуга, включённая по умолчанию."

- id: minor-neutral-confirmation-steps-only
  name: "Only minor neutral confirmation steps"
  detect:
    - "Путь отмены добавляет не более нейтрального подтверждения: одно «вы уверены?» или одно ясно сформулированное резюме того, что означает прекращение тарифа."
  avoid:
    - "Повторные подтверждения, удерживающие предложения, от которых потребитель должен отказываться более одного раза, и эмоционально окрашенные формулировки."

- id: material-cancellation-obstruction
  name: "Material obstruction to cancelling"
  detect:
    - "Что-то на экране существенно мешает отмене: опция скрыта, спрятана на несколько уровней вглубь, доступна только через другой канал, чем оформление, либо флоу завершается без подтверждения, что отмена вступила в силу."
  avoid:
    - "Видимая опция отмены, достижимая примерно за столько же шагов, сколько потребовалось для подключения."

- id: ru-consumer-b2c-transaction
  name: "Offer addressed to a Russian consumer for personal needs"
  detect:
    - "Проверяемый флоу продаёт товары или услуги физическому лицу для личных, семейных или домашних нужд: розничные формулировки о товаре, личный аккаунт, потребительские цены, индивидуальные поля чекаута — имя, телефон, личный email, адрес доставки."
    - "Русскоязычные потребительские сигналы на экране — «покупатель», «потребитель», «доставка», «личный кабинет», «для личного пользования» — либо обычная розничная витрина, адресованная частным лицам."
  avoid:
    - "Предложение, явно адресованное бизнесу: обязательные поля юрлица или ИНН/ОГРН, «для юридических лиц», «для бизнеса», закрытый B2B-кабинет или оптовые условия. Неизвестный тип покупателя остаётся неизвестным; сами по себе русский язык, цены в рублях или домен .ru его не подтверждают."

- id: ru-recurring-charge-enabled
  name: "The flow enables recurring charges from saved payment credentials"
  detect:
    - "Шаг активирует подписку, автопродление или повторные списания с сохранённой карты или сохранённых платёжных данных либо сохраняет платёжные данные для будущих списаний."
    - "Русскоязычные сигналы: «подписка», «автопродление», «спишем», «ежемесячно», «далее … ₽/мес», «сохранить карту», «привязать карту»."
  avoid:
    - "Разовый платёж, при котором платёжные данные не сохраняются и ни продление, ни повторное списание не включаются."

- id: ru-electronic-refusal-path-absent
  name: "No in-product electronic path to refuse saved credentials or stop auto-renewal"
  detect:
    - "В аккаунте или разделе отмены нет работающего инструмента самообслуживания, чтобы посмотреть сохранённые карты, удалить карту, отказаться от дальнейшего использования сохранённых платёжных данных или отключить автопродление; единственный заявленный маршрут — звонок, письмо, чат с оператором или обращение в поддержку."
    - "Русскоязычные сигналы: «позвоните в поддержку», «напишите нам письмо», «обратитесь к оператору», либо карта показана как удалённая, хотя следующее списание по-прежнему анонсировано."
  avoid:
    - "Видимый работающий инструмент самообслуживания в аккаунте — «Удалить карту», «Отключить автопродление», «Отменить подписку», — который действует электронно, без обращения в поддержку."

- id: ru-total-price-displayed-before-payment
  name: "The full final price in rubles is shown before the payment action"
  detect:
    - "До того как потребитель подтверждает оплату, экран указывает итоговую сумму к оплате в рублях с учётом каждого обязательного платежа вместе с условиями оплаты, так что ни одна обязательная стоимость не появляется впервые на шаге оплаты или после него."
  avoid:
    - "Заявленная цена или цена тарифа, не включающая обязательный сбор, налог или сервисный сбор, который добавляется только на более позднем шаге, в строке «Итого» или в чеке."

- id: ru-additional-paid-service-preselected
  name: "A paid add-on service is preselected or already in the order"
  detect:
    - "Платная допуслуга — страховка, защита покупки, СМС-уведомления, расширенная гарантия, приоритетная поддержка — предотмечена, включена переключателем по умолчанию или уже добавлена в корзину или в итог заказа без отдельного утвердительного выбора."
    - "Русскоязычные сигналы допуслуг: «Защита покупки», «Страхование заказа», «СМС-информирование», «Гарантия+», показанные во включённом состоянии по умолчанию."
  avoid:
    - "Необязательная платная допуслуга, показанная неотмеченной, со своей видимой ценой и требующая явного действия активного выбора."

- id: ru-decline-addon-blocks-primary-purchase
  name: "Declining the paid add-on blocks or degrades the primary purchase"
  detect:
    - "Отказ от дополнительной платной услуги не даёт завершить основной заказ: кнопка «продолжить» или «оплатить» остаётся неактивной, флоу возвращает назад, либо экран сообщает, что заказ нельзя оформить без допуслуги."
  avoid:
    - "Основная покупка завершается нормально на тех же условиях после отказа от допуслуги."

- id: ru-paid-service-subscription-contract
  name: "The offer is a paid consumer service, not a plain goods sale"
  detect:
    - "Потребитель платит за услугу или постоянный доступ — подписку, курс, тариф приложения, членство или цифровой сервис, — а не за разовую покупку товара."
  avoid:
    - "Обычная покупка товара с доставкой без услуги или компонента доступа."
- id: ru-advertising-or-promo-claim-present
  name: "An advertising or promotional claim is visible in the flow"
  detect:
    - "На экране есть рекламное утверждение, направленное на решение о покупке: превосходная степень («Лучший», «№ 1», «самый выгодный»), элемент дефицита или обратного отсчёта («осталось 2 штуки», тикающий таймер), отзыв или модуль отзывов, используемый как реклама, значок награды, одобрение СМИ или эксперта либо обещание результата."
  avoid:
    - "Простые описательные факты о товаре (размер, состав, сроки доставки) без рекламного утверждения, приёма дефицита или одобрения."

# ru-гейты контентных доменов (волна 1): собственные исключения обзорного PDF и факты,
# которые экран сам по себе показать не может.
- id: condemning-historical-context-present
  name: "Clearly condemning historical context frames the symbol"
  detect:
    - "Символ появляется внутри явно осуждающего исторического контекста — обзорный PDF называет игры и энциклопедии, — где окружающий текст или обстановка осуждают его, а не показывают нейтрально или декоративно."
  avoid:
    - "Нейтральное, декоративное, стилистическое или рекламное размещение символа без осуждающего контекста."

- id: official-government-service-context
  name: "The interface is a government body's own service"
  detect:
    - "Захваченные экраны принадлежат официальному сервису государственного или муниципального органа, использующего свою символику по собственным правилам этого органа."
  avoid:
    - "Коммерческий продукт, стилизованный под государственный сервис."

- id: banned-org-status-note-present
  name: "A correct status note accompanies the mention"
  detect:
    - "Текстовое упоминание указанной организации сопровождается видимой пометкой о её статусе, например «организация признана экстремистской и запрещена в РФ» или «принадлежит Meta, признанной экстремистской»."
  avoid:
    - "Пометка отсутствует, скрыта или привязана к логотипу или кнопке «поделиться», а не к текстовому упоминанию — пометка не легализует логотипы, кнопки, рекламу или пожертвования."

- id: ru-author-listed-foreign-agent
  name: "The author is confirmed on the foreign-agent registry"
  detect:
    - "Оператор или реестр Минюста подтверждает, что автор материала или издание в настоящее время включены в реестр иностранных агентов."
  avoid:
    - "Вывод из репутации, тематики или стиля автора — включение в реестр никогда не видно на экране и должно быть подтверждено."

- id: foreign-agent-label-compliant
  name: "The foreign-agent label meets the prescribed form"
  detect:
    - "Требуемый текст маркировки присутствует, набран шрифтом вдвое крупнее основного текста, контрастен, размещён после заголовка; в аудио или видео — в начале и после каждого перерыва."
  avoid:
    - "Маркировка присутствует, но мельче, малоконтрастна, размещена не на своём месте или обрезана."

- id: age-label-visible
  name: "The age mark is visible on the product card"
  detect:
    - "Знак «0+»…«18+» или текст «запрещено для детей» виден в самой карточке или баннере, а на баннере мероприятия занимает не менее требуемой доли площади."
  avoid:
    - "Знак присутствует только в свёрнутом описании, всплывающей подсказке или на отдельной странице."

- id: equal-russian-duplicate-present
  name: "Russian text is first and the duplicate is equal"
  detect:
    - "Русскоязычный текст интерфейса идёт первым, и любой дубликат на иностранном языке совпадает с ним по цвету, шрифту, размеру и читаемости, с идентичной озвучкой там, где она есть."
  avoid:
    - "Русский текст вторичен, заметно слабее или отсутствует для элементов, обращённых к потребителю."

- id: ru-consumer-facing-public-ui
  name: "The interface is public and consumer-facing"
  detect:
    - "Захваченные экраны — публичный сайт или приложение, адресованные потребителям: витрина, лендинг, чекаут, публичный контент, — а не закрытый бизнес-кабинет."
  avoid:
    - "Закрытый B2B-кабинет за корпоративным входом: обзорный PDF называет прямое применение там спорным, поэтому языковая обязанность остаётся условной."

# гейты контентных доменов, волна 2
- id: ru-social-network-threshold-met
  name: "The service is a social network over the statutory daily-audience threshold"
  detect:
    - "Оператор подтверждает, что сервис является социальной сетью с более чем 500 000 российских пользователей в сутки."
  avoid:
    - "Вывод из популярности или узнаваемости бренда — порог никогда не виден на экране."

- id: ru-registered-media-outlet
  name: "The product is a registered media outlet"
  detect:
    - "Оператор подтверждает регистрацию СМИ, либо сама страница показывает реквизиты свидетельства о регистрации."
  avoid:
    - "Признание любого похожего на новостной сайта зарегистрированным СМИ без подтверждения."

- id: ru-adult-barrier-present
  name: "A real age barrier guards the 18+ section"
  detect:
    - "Раздел 18+ находится за барьером доступа с размытыми превью и безопасным поиском по умолчанию, а не за одной лишь кнопкой подтверждения."
  avoid:
    - "Признание единственной кнопки «Мне есть 18» барьером — обзорный PDF называет её минимальной мерой, а не гарантией."

- id: ru-org-listed-undesirable
  name: "The organization is confirmed on the undesirable list"
  detect:
    - "Оператор или перечень Минюста подтверждает, что встроенная организация в настоящее время признана нежелательной."
  avoid:
    - "Вывод из профиля организации или её освещения в СМИ — включение в перечень должно быть подтверждено."

# гейты волны 3a
- id: separate-unticked-consent-present
  name: "Personal-data consent is a separate unticked checkbox"
  detect:
    - "Согласие на обработку данных — отдельная неотмеченная галочка со ссылкой на собственный текст согласия, отдельно от галочек оферты и рекламной рассылки."
  avoid:
    - "Одна объединённая галочка, покрывающая сразу оферту, данные и рассылку."

- id: unsubscribe-link-present
  name: "A working unsubscribe link is visible in the message"
  detect:
    - "Рекламное сообщение показывает читаемую ссылку «отписаться» или эквивалентный работающий способ отказа."
  avoid:
    - "Отказ от рассылки, скрытый только за обращением в поддержку."

- id: privacy-policy-link-visible
  name: "A policy link sits next to the form"
  detect:
    - "Видимая ссылка на политику обработки персональных данных сопровождает форму сбора данных на показанном экране."
  avoid:
    - "Предположение о ссылке в подвале за пределами захвата."

- id: appeal-control-present
  name: "Explanation and a working appeal control accompany the decision"
  detect:
    - "Экран автоматизированного решения объясняет результат и предлагает работающий элемент «оспорить», ведущий к рассмотрению человеком."
  avoid:
    - "Общий e-mail поддержки без обязательства рассмотреть обращение."

- id: alternative-login-present
  name: "A non-biometric alternative login is offered"
  detect:
    - "Рядом со входом по лицу или голосу экран предлагает пароль, код или другой небиометрический способ входа."
  avoid:
    - "Биометрия как единственный видимый путь."

- id: receipt-destination-field-present
  name: "The receipt-destination field precedes payment"
  detect:
    - "Поле телефона или e-mail, подписанное как адрес для чека, стоит перед кнопкой «Оплатить», либо ранее собранный адрес явно повторён на шаге оплаты."
  avoid:
    - "Признание общего контактного поля без пометки о чеке адресом для чека."

- id: owner-identity-visible
  name: "Owner identity is visible on the shown pages"
  detect:
    - "Показанные страницы содержат наименование владельца с ИНН/ОГРН и контактами (подвал или блок «о компании»)."
  avoid:
    - "Одно лишь название бренда без юридических реквизитов."

- id: russian-auth-method-available
  name: "A Russian authorization method is offered"
  detect:
    - "Телефон российского оператора, Госуслуги (ЕСИА), VK ID, Яндекс ID, Сбер ID или эквивалентный российский способ явно предложен при входе."
  avoid:
    - "Только иностранный SSO."

- id: recsys-notice-visible
  name: "The recommender-technology notice is visible"
  detect:
    - "Видимое уведомление «применяются рекомендательные технологии» со ссылкой на правила применения присутствует на показанных экранах."
  avoid:
    - "Предположение об уведомлении где-то ещё на ресурсе."

- id: published-loyalty-rules-linked
  name: "Published loyalty-program rules are linked at the price"
  detect:
    - "Отличающаяся цена явно ссылается на опубликованные правила программы с указанием категории и условий."
  avoid:
    - "Необъяснённая персональная цена."

- id: identity-linked-price-difference-shown
  name: "The identity-linked price difference is shown on screen"
  detect:
    - "Сами экраны показывают один и тот же товар по разным ценам в зависимости от личности или статуса пользователя — сравнение, строка «для новых» рядом с видимым входом в аккаунт."
  avoid:
    - "Вывод о дискриминации из единственной цены без сравнения."

# гейты волны 3b
- id: ru-credit-product-context
  name: "The flow is a consumer credit or loan"
  detect:
    - "Экраны предлагают потребительский кредит или заём: ставка, срок, брендинг кредитора, поля заявки на кредит."
  avoid:
    - "Обычный чекаут товаров/услуг без кредита."

- id: ru-regulated-entity-context
  name: "The operator is a regulated messenger-ban subject"
  detect:
    - "Продукт принадлежит банку, оператору связи, государственному учреждению, крупному агрегатору или маркетплейсу (подтверждено или очевидно из самого продукта)."
  avoid:
    - "Обычные компании вне перечисленных категорий."

- id: ru-government-service-context
  name: "The interface is a state or municipal service"
  detect:
    - "Экраны принадлежат государственному сервису: брендинг Госуслуг, официальный орган как оператор, форма государственной услуги."
  avoid:
    - "Коммерческие продукты, стилизованные под государственные сервисы."

- id: ru-child-audience-context
  name: "The product or creative targets children"
  detect:
    - "Раздел, продукт или реклама адресованы детям: детский брендинг, возрастное позиционирование, школьный контекст."
  avoid:
    - "Продукты для общей аудитории."

- id: ru-gost-referenced-in-contract
  name: "The contract or ToR references the accessibility GOST"
  detect:
    - "Оператор подтверждает, что договор или техническое задание ссылается на ГОСТ Р 52872."
  avoid:
    - "Предположение о такой ссылке; в остальных случаях для бизнеса стандарт добровольный."

- id: ru-foreign-owner-confirmed
  name: "Foreign ownership of the resource is confirmed"
  detect:
    - "Оператор подтверждает, что ресурс управляется иностранным лицом."
  avoid:
    - "Догадка по языку или домену."

- id: ru-foreign-500k-audience-confirmed
  name: "The 500k daily RF audience threshold is confirmed"
  detect:
    - "Оператор подтверждает, что ресурс превышает 500 000 пользователей в сутки из России."
  avoid:
    - "Догадка по размеру бренда."

- id: operator-confirmed-no-consent
  name: "Absence of the person's consent is confirmed"
  detect:
    - "Оператор или изображённое лицо подтверждает, что согласие на использование изображения не давалось, вне исключений для публичных мероприятий и позирования за плату."
  avoid:
    - "Вывод об отсутствии согласия из самого экрана."

- id: operator-confirmed-imitation-target
  name: "The imitated competitor is confirmed"
  detect:
    - "Оператор называет конкретного конкурента, чей фирменный стиль воспроизведён, и референс доступен."
  avoid:
    - "Признание типовой для категории стилистики имитацией."

- id: psk-frame-present
  name: "The PSK frame is present as prescribed"
  detect:
    - "Полная стоимость кредита размещена в квадратной рамке в правом верхнем углу первого экрана, прописными буквами, самым крупным шрифтом."
  avoid:
    - "ПСК упомянута только в основном тексте."

- id: separate-credit-application-present
  name: "The add-on runs through its own application"
  detect:
    - "Допуслуга к кредиту оформляется через отдельное заявление с указанием цены и права на отказ."
  avoid:
    - "Предотмеченная галочка внутри кредитного флоу."

- id: captions-present
  name: "Captions or a transcript accompany the media"
  detect:
    - "Субтитры включены, либо текстовая расшифровка расположена рядом с аудио/видео сервиса."
  avoid:
    - "Расшифровка обещана, но не показана."

# --- прогон «сбор пробелов» 2026-10-04 ---
- id: ru-voluntary-insurance-context
  name: "A voluntary insurance product is sold to the consumer"
  detect:
    - "Флоу продаёт или уже продал добровольную страховую допуслугу физическому лицу: «страхование на время перелёта», «защита покупки», «страховка багажа», «страхование отмены поездки», назван страховщик или полис, показана премия."
  avoid:
    - "Обязательное страхование (ОСАГО), страхование, встроенное в продукт по закону, или полис B2B."
- id: ru-air-carriage-context
  name: "The flow books passenger air carriage"
  detect:
    - "Экраны — флоу бронирования авиакомпании или билетного агента: рейсы, тарифы («Промо», «Эконом»), данные пассажиров, карта мест, багаж, брендинг системы бронирования."
  avoid:
    - "Железнодорожный, автобусный, гостиничный или обычный розничный чекаут."
