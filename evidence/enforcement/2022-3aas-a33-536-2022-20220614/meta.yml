decision_date: 2022-06-14
respondent: Управление Федеральной службы по надзору в сфере защиты прав потребителей и благополучия человека по Красноярскому краю
applicant: акционерное общество «Авиакомпания «Нордстар» (ИНН 8401008386, ОГРН 1028400000200), апеллянт
norms_cited:
  - "КоАП РФ ст. 14.8 ч. 2"
  - "ЗоЗПП ст. 16"
  - "ФАП (приказ Минтранса № 82) п. 30"
  - "АПК РФ ст. 272.1, 288.2 ч. 3"
sanction: "Решение от 24.03.2022 оставлено без изменения, апелляционная жалоба — без удовлетворения (стр. 4); постановление вступает в силу с момента принятия"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 1
    quote: "В ходе проверки Роспотребнадзором установлено нарушение АО «АК «НордСтар» требований пункта 2 статьи 16 Закона Российской Федерации от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее - Закон о защите прав потребителей), выраженное в том, что приобретение услуги перевозки (заключение договора воздушной перевозки пассажира) на сайте nordstar.ru обусловлено приобретением услуги по подбору провозной платы."
  - page: 2
    quote: "2 А33-536/2022 По факту выявленных нарушений должностным лицом Роспотребнадзора в отношении общества составлен протокол об административном правонарушении от 16.12.2021 № 39605 и вынесено постановление 16.12.2021 №39605, в соответствии с которым АО «АК «НордСтар» привлечено к административной ответственности по части 2 статьи 14.8 Кодекса Российской Федерации об административной ответственности (далее - КоАП РФ) с назначением наказания в виде административного штрафа в размере 10 000 рублей."
  - page: 3
    quote: "В случае несогласия пассажира с условиями электронной покупки, включая взимание платы за услугу по подбору провозной платы, приобретение авиабилета на сайте авиакомпании становится невозможным, что подтверждается АО «АК «НордСтар»."
  - page: 4
    quote: "Арбитражного процессуального кодекса Российской Федерации, Третий арбитражный апелляционный суд ПОСТАНОВИЛ: решение Арбитражного суда Красноярского края от 24 марта 2022 года по делу № А33-536/2022 оставить без изменения, апелляционную жалобу - без удовлетворения."
