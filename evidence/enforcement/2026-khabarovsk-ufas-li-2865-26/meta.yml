  - "38-ФЗ ст. 5 ч. 10.8; ст. 38 ч. 7"
  - "КоАП РФ ст. 14.3 ч. 18; ст. 4.1.1"
sanction: "Признан виновным по ч. 18 ст. 14.3 КоАП; наказание — предупреждение (стр. 5)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 2
    quote: "«MISSION DAWAH»; ссылка (https://t.me/mdw_vpn_bot?start=30day) на бот в мессенджере «Telegram» (@mdw_vpn_bot), предоставляющий доступ к VPN (VPN Mission Dawah); стоимость доступа к VPN, которая составляет 299, 00 рублей; кнопку «Написать компании», при нажатии которой открывается чат с компанией «<…>»; кнопку «Добавить в запрос по заказу»."
  - page: 2
    quote: "В Управление Федеральной антимонопольной службы по Хабаровскому краю из УМВД России по Хабаровскому краю поступили материалы (вх. № 19332/25 от 15.12.2025), свидетельствующие о распространении через бизнес – аккаунт «<…>» , зарегистрированный за номером телефона <…> в мессенджере «WhatsApp» ненадлежащей рекламы «VPN»."
  - page: 3
    quote: "При этом частью 18 статьи 14.3 КоАП РФ предусмотрено наложение различных размеров штрафа в зависимости от обстоятельств, смягчающих или отягчающих административную ответственность."
  - page: 4
    quote: "В соответствии с частью 3.5 статьи 4.1, статьи 4.1.1 КоАП РФ административное наказание в виде предупреждения назначается за впервые совершенные административные правонарушения при отсутствии причинения вреда или угрозы причинения вреда жизни и здоровью людей, объектам животного и растительного мира, окружающей среде, объектам культурного наследия (памятникам истории и культуры) народов Российской Федерации, безопасности государства, угрозы чрезвычайных ситуаций природного и техногенного характера, а также при отсутствии имущественного ущерба."
site_or_app: бизнес-аккаунт в мессенджере WhatsApp
