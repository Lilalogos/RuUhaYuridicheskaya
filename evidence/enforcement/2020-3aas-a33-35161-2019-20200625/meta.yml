id: 2020-3aas-a33-35161-2019-20200625
scenario: [G2]
act_type: "постановление арбитражного суда"
authority: Третий арбитражный апелляционный суд
case_number: "А33-35161/2019"
decision_date: 2020-06-25
respondent: Управление Федеральной службы по надзору в сфере защиты прав потребителей и благополучия человека по Красноярскому краю (административный орган)
applicant: акционерное общество «Авиакомпания «НордСтар» (заявитель, апеллянт)
norms_cited:
  - "КоАП РФ ст. 14.8 ч. 2; ст. 4.1.1"
  - "ЗоЗПП ст. 16"
  - "ФАП (приказ Минтранса № 82)"
sanction: "Решение АС Красноярского края от 29.01.2020 оставлено без изменения, апелляционная жалоба — без удовлетворения (стр. 15); штраф 10 000 ₽ по ч. 2 ст. 14.8 (постановление № 27740) сохранён"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 6
    quote: "Постановлением по делу об административном правонарушении от 25.10.2019 № 27740 общество привлечено к административной ответственности по части 2 статьи 14.8 КоАП РФ в виде штрафа в размере 10 000 рублей."
  - page: 10
    quote: "Так, для заключения договора воздушной перевозки с АО «АК «Нордстар» потребитель Насонов С.Т. вынужден был приобрести возмездную услугу по оформлению провозной емкости у иного хозяйствующего субъекта - ООО «Норильск-ТАВС»."
  - page: 11
    quote: "Таким образом, АО «АК «Нордстар» обусловило приобретение услуги воздушной перевозки обязательным приобретением возмездной услуги по оформлению провозной"
  - page: 11
    quote: "Указанный довод заявителя является несостоятельным, поскольку, как обосновано отмечено судом первой инстанции, наличие на сайте nordstar.ru активной ссылки на условия электронной покупки, проставление отметки о согласии с ними, не может свидетельствовать о выражении потребителем воли в получении услуги по оформлению провозной емкости, поскольку это вынужденное действие, поскольку несогласие пассажира с условиями электронной покупки, включая взимание платы за услугу по оформлению провозной емкости, делает невозможным приобретение авиабилета на сайте авиакомпаний."
site_or_app: nordstar.ru
