sanction: "В удовлетворении заявления об отмене постановления Управления от 16.12.2021 № 39605 отказано (стр. 13); по постановлению — штраф 10 000 ₽ по ч. 2 ст. 14.8 КоАП (стр. 4)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 2
    quote: "Из материалов обращения Даминовой Д.И. следует, что 29.07.2021 она посредством официального интернет-сайта АО «АК «НордСтар» https://www.nordstar.ru заключила договор воздушной перевозки с АО «АК «НордСтар» (билеты № 4762403314683, 4762403314684 на рейсы Y7-751 от 04.09.2021 по маршруту Москва-Закинтос, Y-752 от 16.09.2021 по маршруту Закинтос-Москва)."
  - page: 3
    quote: "3 А33-536/2022 клиринговая палата» (далее «Агентством»), с оплатой Дополнительных расходов и сборов, взимаемых Агентством, в том числе сбора за услугу по подбору провозной платы в сумме 550 рублей (сбор УЛ)»."
  - page: 4
    quote: "Наличие на сайте https://www.nordstar.ru активной ссылки на Условия Электронной покупки, проставление отметки о согласии с ними, не может свидетельствовать о выражении потребителем воли в получении услуги по подбору провозной платы, поскольку это вынужденное действие."
  - page: 4
    quote: "Постановлением № 39605 по делу об административном правонарушении от 16.12.2021 АО «АК «НордСтар» признано виновным в совершении правонарушения, предусмотренного частью 2 статьи 14.8 КоАП РФ, назначено административно наказание в виде административного штрафа в размере 10 000 руб."
site_or_app: nordstar.ru; booking.nordstar.ru
