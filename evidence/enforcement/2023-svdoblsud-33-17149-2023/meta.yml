sanction: "Возложить обязанность прекратить автоматическое включение в договор авиаперевозки пассажиров согласия на предоставление дополнительных платных услуг; госпошлина 300 руб. (стр. 5)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 2
    quote: "появляется информационное окно «Дополнительные услуги», в котором потребителю сообщается следующая информация: «доп. услуги 3 + 895р., страхование + 270 р., врач онлайн + 300 р., питание + 325 р.»."
  - page: 4
    quote: "Стоимость авиабилета по маршруту Астрахань – Екатеринбург 16.08.2022 на рейс U6-204 составила по тарифу «Промо» 9 085 руб. (л.д. 77), а общая стоимость с учетом стоимости дополнительных услуг (в виде страхования – 270 руб., питания – 325 руб., услуги «врач онлайн» – 300 руб.) – 9 980 руб. (л.д. 84)."
  - page: 4
    quote: "предусмотрено автоматическое проставление в форме основного договора авиаперевозки, имеющего вид click-wrap-соглашения, согласия потребителя на заключение договора добровольного страхования и иных договоров в виде отметки («галочки»), подтверждающей намерение заключить сделки, предметом которых является оказание дополнительных услуг."
  - page: 3
    quote: "Кроме того, в настоящее время на сайте авиакомпании при оформлении билета дополнительные услуги автоматически не выбираются."
