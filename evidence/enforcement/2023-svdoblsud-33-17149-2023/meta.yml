notes: >-
  1) act_type: в документе «апелляционное определение»; значение выбрано из списка §4 как ближайшее.
  2) Решение 1-й инстанции (Октябрьский р/с Екатеринбурга, 23.03.2023) — отказ; отменено (стр. 5).
  3) Номер 1-й инстанции в тексте «2-2276/2022» (стр. 1), в выдаче поиска облсуда — «2-2276/2023»; оставлено как в документе.
  4) Цитата стр. 3 про то, что «в настоящее время» допуслуги не выбираются, — довод ответчика, не вывод суда.
  5) Факты интерфейса — контрольная покупка 30.07.2022 (стр. 2) и скриншоты 2022 г. (стр. 4), до 69-ФЗ.
  6) В source.pdf на стр. 1 есть элементы меню сайта суда (печать страницы целиком).
  7) Карточка дела на сайте облсуда (card.pdf/card.html, снимок 2026-10-04): результат «решение (осн. требов.) отменено полностью с вынесением нового решения», 31.10.2023; сведений о кассационном обжаловании карточка не содержит (упоминание 7КСОЮ — ссылка меню сайта). Финальность по карточке не устанавливается.
