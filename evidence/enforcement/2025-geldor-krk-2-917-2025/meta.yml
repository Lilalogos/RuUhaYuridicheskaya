notes: >-
  1) Номер дела в тексте акта обезличен («№», стр. 1). Карточка суда (не текст акта): «2-917/2025 (2-4777/2024;) ~ М-3537/2024», вступление в законную силу 03.09.2025 — в поля не перенесено.
  2) Даты контрольного бронирования и изменения сайта обезличены «ДД.ММ.ГГГГ» (стр. 5–7). В возражениях ответчика: «в ноябре 2024 года изменен процесс оформления услуг страхования на сайте» (стр. 2).
  3) Стр. 6 описывает изменённый флоу (выбор «хочу получить выплату …» / «беру все риски на себя») — факт для разметки clean/gold Виталием.
  4) В требовании прекратить действия отказано, т.к. к моменту решения сайт изменён (стр. 6–7).
  5) Письмо ЦБ от 15.07.2024 № 59-2-2/34868 — 12 сайтов с автоматически проставленным согласием (стр. 5).
  6) В source.pdf на стр. 1 элементы меню сайта суда (печать страницы целиком).
  7) Карточка дела на сайте суда (card.pdf/card.html, снимок 2026-10-04): апелляционные жалобы ответчика (№ 1) и третьего лица АО «АльфаСтрахование» (№ 2) рассмотрены Красноярским краевым судом 03.09.2025 — «Оставить решение (определение) БЕЗ ИЗМЕНЕНИЯ, а жалобу или представление без удовлетворения»; исполнительный лист 24RS0017#2-917/2025#1 выдан 24.09.2025 (card.pdf, стр. 3). Текст апелляционного определения Красноярского краевого суда не архивирован (поиск на сайте краевого суда — капча).
