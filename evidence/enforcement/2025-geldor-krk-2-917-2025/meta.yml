sanction: "Признать действия по автоматическому проставлению согласия … ущемляющими права потребителей; обязать довести решение до сведения потребителей через СМИ в течение 10 рабочих дней со дня вступления в силу; в требовании прекратить действия — отказать; госпошлина 6 000 рублей (стр. 7)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 5
    quote: "навязывается дополнительная платная услуга «Страхование на время перелета», так как она подключается без добровольного волеизъявления неопределенно-круга потребителей, путем автоматически проставления согласия в виде «галочки», после того как потребитель уже сделал выбор и согласился с итоговой стоимостью услуг"
  - page: 6
    quote: "потребитель при оформлении авиабилетов, перейдя к вкладке «Страхование», может сделать самостоятельный выбор заключать договор страхования или нет, а также выбрать следующие страховые продукты: «Страхование на время прилета» (два варианта выбора: «хочу получить выплату при страховом случае за 470 рублей» или «беру все риски на себя») и «Страхование отмены поездки за 400 рублей»."
  - page: 6
    quote: "на момент подачи искового заявления при реализации авиабилетов дистанционным способом через сайт АО «АК «Нордстар» в информационно-телекоммуникационной сети «Интернет» предусматривалось автоматическое проставление в форме основного договора авиаперевозки согласия потребителя на заключение договора страхования в виде отметки («галочка»)"
site_or_app: nordstar.ru            # стр. 7: «https://www.nordstar.ru»; на стр. 1, 5, 6 — «https://www/nordstar.ru/», как в документе
