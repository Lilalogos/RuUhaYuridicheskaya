    quote: "18.1 Закона о рекламе, реклама, распространяемая в информационнотелекоммуникационной сети «Интернет», за исключением рекламы, размещенной в телепрограммах и телепередачах, радиопрограммах и радиопередачах, распространяемых в информационно-телекоммуникационной сети «Интернет», должна содержать пометку «реклама», а также указание на рекламодателя такой рекламы и (или) сайт, страницу сайта в информационнотелекоммуникационной сети «Интернет», содержащие информацию о рекламодателе такой рекламы."
