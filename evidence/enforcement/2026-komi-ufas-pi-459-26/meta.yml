    quote: "На рекламном изображении была указана: пометка «Реклама», сведения о рекламодателе (ООО «А-КОСМЕТИК, ИНН:"
  - page: 7
    quote: "36 Закона о рекламе и в соответствии с пунктами 42 - 49 Правил рассмотрения антимонопольным органом дел, возбужденных по признакам нарушения законодательства Российской Федерации о рекламе, утвержденных Постановлением Правительства РФ от 24.11.2020 № 1922, Комиссия Р Е Ш И Л А:"
