    quote: "Согласно, информации размешенной по ссылке, указанной в сообщении: http://madv.ru/green_pyatnica/iX-bC (полный вариант URL: https://ido.innopolis.university/zp?utm_source=sms&utm_medium=promo_15.11 &utm_campaign=zp), скидка на курсы не достигает 50%, так как не превышает 40 %."
