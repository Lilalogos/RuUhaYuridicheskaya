id: 2024-tatarstan-ufas-rv-08-1262
scenario: [G7-рассылки]
act_type: "постановление"
authority: Татарстанское УФАС России
case_number: "016/04/14.3-1900/2024 (постановление № РВ-08/1262)"
decision_date: 2025-02-11
respondent: ООО «Агроторг» (ИНН 7825706086, ОГРН 1027809237796)
applicant: заявление физического лица
norms_cited:
  - "38-ФЗ ст. 18 ч. 1"
  - "КоАП РФ ст. 14.3 ч. 4.1; ст. 32.2"
sanction: "ООО «Агроторг» признано виновным по ч. 4.1 ст. 14.3 КоАП; административный штраф 400 000 рублей 00 копеек (стр. 5)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 2
    quote: "В Управление Федеральной антимонопольной службы по Республике Татарстан (далее – Управление, Татарстанское УФАС России) на рассмотрение поступило обращение от <…> (вх. № 8357/ж от 05.08.2024 г.) о распространении 03.08.2024 года в 09 часов 03 минут на телефонный номер заявителя <…> без предварительного его согласия посредством телефонного сообщения с буквенного номера «Pyaterochka»."
  - page: 4
    quote: "На текущий период ООО «Агроторг» не может представить информации каким способом заявитель выразил согласие на получение рекламных материалов, т.к. после регистрации личный кабинет гостя становится доступен как через сайт, так и через мобильное приложение независимо от способа регистрации."
  - page: 4
    quote: "По умолчанию данный чек-бокс является пустым и не содержит предустановленной «галочки»."
  - page: 5
    quote: "Ответственность за данное правонарушение предусмотрена частью 4.1 статьи 14.3 КоАП РФ, согласно которой нарушение установленных законодательством «О рекламе» требований к рекламе, распространяемой по сетям электросвязи, – влечет наложение административного штрафа на граждан в размере от десяти тысяч до двадцати тысяч рублей; на должностных лиц - от двадцати тысяч до ста тысяч рублей; на юридических лиц - от трехсот тысяч до одного миллиона рублей."
site_or_app: SMS с буквенного номера «Pyaterochka»; сайт 5ka.ru
