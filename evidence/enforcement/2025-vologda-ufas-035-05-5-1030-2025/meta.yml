interface_facts:
  - page: 2
    quote: "Ростиславова А.А. – председатель комиссии, заместитель руководителя Управления; <…> – член комиссии, начальник отдела защиты конкуренции; <…> – член комиссии, специалист-эксперт отдела защиты конкуренции, рассмотрев дело № 035/05/5-1030/2025 по признакам нарушения части 10.8 статьи 5 Федерального закона от 13.03.2006 года № 38-ФЗ «О рекламе» (далее – Закон о рекламе), выразившихся в распространении рекламы VPN-сервисов в телеграмм-канале, в отсутствии заявителя – Центра по противодействию экстремизму УМВД России по Вологодской области (уведомлен надлежащим образом), в присутствии лица, в чьих действиях усматриваются признаки нарушения рекламного законодательства – <…>, УСТАНОВИЛА:"
  - page: 3
    quote: "Предписание о прекращении нарушения законодательства о рекламе не выдавать."
  - page: 3
    quote: "Признать рекламу в виде электронной ссылки на VPN-сервис «Atlanta VPN bot» (https://t.me/AtlantaVPN_bot? start=ref_1183923334) и VPN-сервис «Молния VPN» (https://t.me/molniya_vpn_bot?start=ref1183923334), распространенную <…> в сети интернет в Телеграмм-канале, ненадлежащей в связи с нарушением требований части 10.8 статьи 5 Федерального закона от 13.03.2006 года № 38-ФЗ «О рекламе»."
site_or_app: Telegram-канал (ссылки на «Atlanta VPN bot», «Молния VPN»)
