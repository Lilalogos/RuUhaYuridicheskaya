interface_facts:
  - page: 5
    quote: "Плата за право пользования сервиса Delivery Club («Сервисный сбор») определяется на основании автоматических алгоритмов, учитывающих регион и адрес доставки заказа, и указывается на этапе оформления заказа, но не менее 1 рубля за каждый заказ, оформленный Пользователем посредством сервиса Delivery Club."
  - page: 5
    quote: "При этом при оформлении заказа у потребителя отсутствовала возможность отказаться от дополнительных услуг в виде «Сервисного сбора»."
  - page: 9
    quote: "факт безальтернативного включения отдельной строкой дополнительного платежа к стоимости заказа в качестве оплаты услуги «сервисный сбор» доказан"
