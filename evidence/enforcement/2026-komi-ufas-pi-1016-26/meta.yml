notes: >-
  1) Позиция: таргет оператора «согласие» не доказывает согласия абонента конкретному рекламораспространителю; явно выраженным должно быть само получение согласия (стр. 7).
  2) Финансовая реклама (ст. 28) — за охватом чекаут-ядра; архивировано ради позиции о согласии.
  3) source.pdf — «Печать→PDF» карточки документа в Базе решений ФАС: стр. 1 — шапка карточки базы, текст акта со стр. 2; нумерация страниц цитат — по PDF.
  4) act_type/scenario — предварительная посадка куратора (прогон «сбор пробелов» 2026-10-04), подтверждает Виталий.
