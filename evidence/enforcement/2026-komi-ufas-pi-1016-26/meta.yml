case_number: "Не установлено по приложенным источникам (решение № ПИ/1016/26)"
decision_date: 2026-02-17
respondent: ООО «СМС-ЛИДС» (ОГРН 1237700191123, ИНН 9701243086) — рекламодатель и рекламораспространитель; ООО «Т2 Мобайл» (ОГРН 1137746610088, ИНН 7743895280) — рекламораспространитель (стр. 6, 8)
applicant: Не установлено по приложенным источникам
norms_cited:
  - "38-ФЗ ст. 18 ч. 1; ст. 28"
  - "126-ФЗ ст. 44.1"
  - "КоАП РФ ст. 14.3"
sanction: "SMS-реклама займов признана ненадлежащей; предписания ООО «Т2 Мобайл» и ООО «СМС-ЛИДС»; материалы для возбуждения дел по ч. 1, 4.1 ст. 14.3 КоАП (стр. 8)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 3
    quote: "«Изучите все условия кредита (займа)» с указанием на раздел официального сайта кредитора, который обеспечивает потребителю рекламы возможность ознакомления с подробными условиями оказания соответствующих услуг, влияющими на полную стоимость потребительского кредита (займа), определяемую в соответствии с Федеральным законом от 21 декабря 2013 года № 353-ФЗ «О потребительском кредите (займе)»."
  - page: 4
    quote: "Рассылка производилась по клиентской базе ООО «Т2 Мобайл» с применением таргета «согласие», т.е. среди абонентов оператора, выразивших согласие на получение рекламы."
  - page: 7
    quote: "Из вышеприведенных положений Закона о рекламе следует, что явно выраженным должно быть именно само получение согласия потребителя на получение рекламных сообщений, а не предоставленная возможность отказаться от получения рекламных сообщений."
site_or_app: SMS-рассылка; сайт-сервис подбора займов (стр. 7)
