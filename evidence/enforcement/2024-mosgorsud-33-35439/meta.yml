sanction: "Обязать прекратить противоправные действия по включению в договор авиаперевозки пассажиров условий, ущемляющих права неопределенного круга потребителей; в течение месяца довести решение до сведения потребителей через СМИ; госпошлина «в размере сумма» (стр. 3)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 1
    quote: "После выбора места, без запроса потребителя отобразилось окно «Дополнительные услуги», в котором сообщается информация об автоматическом подключении дополнительной платной услуги фио стоимостью сумма"
  - page: 1
    quote: "Общая стоимость авиабилета составляет сумма вместо сумма, автоматически включена стоимость услуги страхования."
  - page: 2
    quote: "ООО «Авиакомпания «Победа» установило на своем сайте автоматическое согласие на получение дополнительных услуг путем заранее предустановленного согласия в виде «галочки»."
  - page: 2
    quote: "фактически совершает действия по отказу от страховой услуги путем ее отмены через кнопку «Изменить»."
