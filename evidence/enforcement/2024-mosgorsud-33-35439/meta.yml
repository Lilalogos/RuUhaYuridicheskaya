notes: >-
  1) source.pdf — конвертация из source.doc (обезличенная копия суда), не оригинальный PDF суда; sha256 обоих файлов в source.sha256.
  2) Регион истца в копии обезличен («по адрес»); карточка дела на mos-gorsud.ru называет истца «Управление роспотребнадзора по Астраханской области» — карточка не является текстом акта.
  3) act_type: в документе «апелляционное определение»; значение «решение суда» выбрано из списка §4 как ближайшее — уточнить.
  4) Апелляционная жалоба подана третьим лицом Банком России (стр. 1), не истцом.
  5) Суммы и название услуги («фио») в копии обезличены; в одном месте услуга названа «Полетная страховка» (стр. 2).
  6) Факты интерфейса относятся к проверке 29.07.2022 (стр. 1), до 69-ФЗ.
  7) В конце файла (стр. 3) повторно приведена резолютивная часть.
  8) Карточка дела на mos-gorsud.ru (card.pdf/card.html, снимок 2026-10-04): «Завершено, 22.08.2024 (Отменить судебное постановление полностью, принять новое решение)»; дело отправлено в районный суд 25.10.2024; сведений о кассации карточка не содержит. Истец в карточке: «Управление роспотребнадзора по Астраханской области».
