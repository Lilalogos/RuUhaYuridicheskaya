id: 2024-tatarstan-ufas-016-05-18-1352-2024
scenario: [G7-рассылки]
act_type: "решение УФАС"
authority: Татарстанское УФАС России
case_number: "016/05/18-1352/2024"
decision_date: 2024-11-29
respondent: ООО «Агроторг» (программа лояльности «X5 Клуб» / «Апельсин», отправитель «Pyaterochka»)
applicant: заявление физического лица
norms_cited:
  - "38-ФЗ ст. 18 ч. 1; ст. 3 п. 1"
  - "126-ФЗ «О связи» ст. 44, 44.1"
  - "КоАП РФ ст. 14.3 ч. 4.1 (передача материалов)"
sanction: "Реклама, распространённая ООО «Агроторг» с буквенного номера «Pyaterochka», признана ненадлежащей (ч. 1 ст. 18 38-ФЗ) (стр. 5)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 2
    quote: "Председатель Комиссии: <….>– [должностное лицо] Члены Комиссии: <….>– [должностное лицо] <….>– [должностное лицо] рассмотрев материалы дела в отношении ООО «Агроторг» по факту распространения рекламы посредством направления сообщений с буквенного номера «Pyaterochka» на номер телефона <….> 03 августа 2024 года в 09 часов 03 минуты, 04 сентября 2024 года в 12 часов 20 минут, 11 сентября 2024 года в 10 часов 55 минут без предварительного согласия абонента, что имеет признаки нарушения части 1 статьи 18 Закона о рекламе."
  - page: 4
    quote: "На текущий период ООО «Агроторг» не может представить информации каким способом заявитель выразил согласие на получение рекламных материалов, т.к. после регистрации личный кабинет гостя становится доступен как через сайт, так и через мобильное приложение независимо от способа регистрации."
  - page: 4
    quote: "По умолчанию данный чек-бокс является пустым и не содержит предустановленной «галочки»."
  - page: 5
    quote: "Согласие, полученное посредством заполнения каких-либо форм на сайтах в информационно-телекоммуникационной сети Интернет, не позволяющих однозначно установить, кто именно дал согласие на получение рекламы, является ненадлежащим и влечет нарушение указанного требования ст.18 Федерального закона «О рекламе», поскольку не позволяет подтвердить волеизъявление конкретного абонента на получение рекламы от конкретного рекламораспространителя."
site_or_app: 5ka.ru (сайт программы), мобильное приложение, SMS
