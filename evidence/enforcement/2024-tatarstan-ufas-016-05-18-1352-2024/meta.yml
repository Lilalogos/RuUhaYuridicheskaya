notes: >-
  1) Ключевая позиция: согласие, собранное веб-формами так, что нельзя установить, кто именно его дал, — ненадлежащее (стр. 2); общество не смогло доказать способ получения согласия (стр. 4) — бремя доказывания согласия на рекламораспространителе.
  2) Пустой по умолчанию чек-бокс согласия на рекламу описан обществом как своя практика (стр. 4) — факт для clean-критериев.
  3) source.pdf — «Печать→PDF» карточки документа в Базе решений ФАС: стр. 1 — шапка карточки базы, текст акта со стр. 2; нумерация страниц цитат — по PDF.
  4) act_type/scenario — предварительная посадка куратора (прогон «сбор пробелов» 2026-10-04), подтверждает Виталий.
