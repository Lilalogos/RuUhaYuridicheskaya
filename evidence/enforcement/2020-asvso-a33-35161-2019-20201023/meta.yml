id: 2020-asvso-a33-35161-2019-20201023
scenario: [G2]
act_type: "постановление арбитражного суда"
authority: Арбитражный суд Восточно-Сибирского округа
case_number: "А33-35161/2019"
decision_date: 2020-10-23
respondent: Управление Федеральной службы по надзору в сфере защиты прав потребителей и благополучия человека по Красноярскому краю
applicant: акционерное общество «Авиакомпания «НордСтар» (кассатор)
norms_cited:
  - "КоАП РФ ст. 14.8 ч. 2"
  - "ЗоЗПП ст. 16"
  - "ФАП (приказ Минтранса № 82) п. 15.1"
  - "АПК РФ ст. 286–289, 291.1 ч. 3"
sanction: "Решение от 29.01.2020 и постановление 3ААС от 25.06.2020 оставлены без изменения, кассационная жалоба — без удовлетворения; постановление не подлежит обжалованию в ВС РФ (стр. 7); штраф 10 000 ₽ по ч. 2 ст. 14.8 — окончательно"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 2
    quote: "В ходе проверки Роспотребнадзором установлено нарушение АО «АК «НордСтар» требований пункта 2 статьи 16 Закона от 07.02.1992 № 2300-1 «О защите прав потребителей» (далее – Закон о защите прав потребителей), выраженное в том, что приобретение услуги перевозки (заключение договора воздушной перевозки пассажира) на сайте nordstar.ru обусловлено приобретением возмездной услуги по оформлению провозной емкости."
  - page: 2
    quote: "По факту выявленных нарушений должностным лицом Роспотребнадзора в отношении общества составлен протокол об административном правонарушении № 16360 от 19.07.2019 и вынесено постановление № 27740 от 25.10.2019, в соответствии с которым АО «АК «НордСтар» привлечено к административной ответственности по части 2 статьи 14.8 Кодекса Российской Федерации об административной ответственности (далее – КоАП РФ) с назначением наказания в виде административного штрафа в размере 10 000 рублей."
  - page: 3
    quote: "Вместе с приобретенными билетами Насонову С.Г. выданы квитанции, подтверждающие оплату услуги по оформлению провозной емкости стоимостью 550 рублей каждая."
  - page: 7
    quote: "Постановление вступает в законную силу со дня его принятия и не подлежит обжалованию в Судебную коллегию Верховного Суда Российской Федерации в силу части 3 статьи 291.1 Арбитражного процессуального кодекса Российской Федерации."
site_or_app: nordstar.ru
