notes: >-
  1) Первый архивированный акт по запрету рекламы на ресурсах запрещённых организаций (ч. 10.7 ст. 5 38-ФЗ, введена 72-ФЗ от 07.04.2025) — подтверждает ru-banned-orgs-presence в части рекламы.
  2) Наказание — предупреждение (замена штрафа по ст. 4.1.1 КоАП).
  3) source.pdf — «Печать→PDF» карточки документа в Базе решений ФАС: стр. 1 — шапка карточки базы, текст акта со стр. 2; нумерация страниц цитат — по PDF.
  4) act_type/scenario — предварительная посадка куратора (прогон «сбор пробелов» 2026-10-04), подтверждает Виталий.
