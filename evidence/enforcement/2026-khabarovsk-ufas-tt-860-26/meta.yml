interface_facts:
  - page: 2
    quote: "В Управление Федеральной антимонопольной службы по Хабаровскому краю поступило заявление (вх. № 18920/25 от 08.12.2025), перенаправленное из ФАС России, о распространении в социальной сети Instagram в аккаунте: @katyashaevich_nutritionist ненадлежащей рекламы проектов для подростков: @young_and_active."
  - page: 3
    quote: "Сайт социальной сети «Instagram», принадлежащий компании «Meta Platforms», признанной экстремистской организацией и запрещенной в Российской Федерации, заблокирован в России, поэтому реклама на запрещенном ресурсе не допускается."
  - page: 4
    quote: "В соответствии с частью 3.5 статьи 4.1, статьи 4.1.1 КоАП РФ административное наказание в виде предупреждения назначается за впервые совершенные административные правонарушения при отсутствии причинения вреда или угрозы причинения вреда жизни и здоровью людей, объектам животного и растительного мира, окружающей среде, объектам культурного наследия (памятникам истории и культуры) народов Российской Федерации, безопасности государства, угрозы чрезвычайных ситуаций природного и техногенного характера, а также при отсутствии имущественного ущерба."
site_or_app: Instagram, аккаунт @katyashaevich_nutritionist
