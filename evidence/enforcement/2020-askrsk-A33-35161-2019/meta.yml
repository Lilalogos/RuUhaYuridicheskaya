notes: >-
  1) Дело об оспаривании постановления: заявитель — АО «Авиакомпания «НордСтар», ответчик — Управление Роспотребнадзора; поля applicant/respondent заполнены по процессуальным ролям в документе.
  2) Цитата стр. 7 — изложение письменных пояснений АО «АК «Нордстар» в решении, не вывод суда.
  3) Услуга взималась ООО «Норильск-ТАВС» (стр. 7); продажи на сайте переданы агентству (стр. 7, 9).
  4) Факты — покупка 05.04.2019 (стр. 5), проверка 2019 г.; до 69-ФЗ.
  5) Апелляция (03АП-1328/2020) и кассация (Ф02-4940/2020) по делу есть в карточке kad.arbitr.ru, PDF не скачаны.
  6) PDF скачан Виталием (папка FireShot); оригинальный файл суда с электронной подписью (стр. 12), Producer PDFsharp/iTextSharp.
