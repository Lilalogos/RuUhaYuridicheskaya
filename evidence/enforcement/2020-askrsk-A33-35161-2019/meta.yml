interface_facts:
  - page: 7
    quote: "Оплата авиабилета становится возможной только после того, как пассажир проставит соответствующую отметку о согласии с условиями электронной покупки. В случае несогласия пассажира с условиями электронной покупки, включая взимание платы за услугу по оформлению провозной емкости, приобретение авиабилета на сайте авиакомпаний становится невозможным."
  - page: 8
    quote: "Суд соглашается с доводом ответчика, что наличие на сайте nordstar.ru активной ссылки на условия электронной покупки, проставление отметки о согласии с ними, не может свидетельствовать о выражении потребителем воли в получении услуги по оформлению провозной емкости, поскольку это вынужденное действие."
  - page: 5
    quote: "подтверждающие оплату услуги по оформлению провозной емкости стоимостью 550 руб. каждый."
site_or_app: nordstar.ru             # стр. 5, 8
