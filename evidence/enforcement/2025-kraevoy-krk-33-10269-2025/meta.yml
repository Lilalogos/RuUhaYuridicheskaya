sanction: "Решение Железнодорожного районного суда г. Красноярска от 26.03.2025 оставлено без изменения, апелляционные жалобы АО «АльфаСтрахование» и АО «Авиакомпания «Нордстар» — без удовлетворения (стр. 7)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 1
    quote: "Признать действия акционерного общества «Авиакомпания «Нордстар» по автоматическому проставлению согласия за потребителей на подключение дополнительной платной услуги личного страхования и иных платных услуг, ущемляющими права потребителей, установленные законодательством о защите прав потребителей."
  - page: 5
    quote: "Оспаривая законность постановленного судом решения, представитель АО «АльфаСтрахование» в апелляционной жалобе указывает, что приобретение дополнительных услуг на сайте авиакомпании в данном случае не является автоматическим и зависит от выбора самого приобретателя авиабилета."
  - page: 6
    quote: "Материалами дела подтверждается, что ответчиком при реализации авиабилетов дистанционным способом через сайт АО Авиакомпания «Нордстар» в информационно-телекоммуникационной сети «Интернет» предусмотрено автоматическое проставление в форме основного договора авиаперевозки, согласия потребителя на заключение договора добровольного страхования и иных договоров в виде отметки («галочки»), подтверждающей намерение заключить сделки, предметом которых является оказание дополнительных услуг."
  - page: 6
    quote: "При этом, независимо от наличия или отсутствия у потребителя возможности отказаться от дополнительных услуг при заключении договора, само по себе наличие автоматического согласия на оказание таких услуг, в том числе в части добровольного страхования, при покупке авиабилета является недопустимым, указывая на недобросовестное поведение авиакомпании по навязыванию дополнительных услуг."
