  - "ЗоЗПП ст. 8 п. 1, 2; ст. 10 п. 1, 2; ст. 16 п. 1 абз. 1, п. 2 пп. 5, 6, 15; ст. 46"
  - "ГК РФ ст. 421, 422, 927, 934, 935"
  - "ВК РФ ст. 100, 102"
