sanction: "ООО «Авиакомпания «Победа» признано виновным по ч. 1 ст. 14.3 КоАП; административный штраф 100 000 рублей (стр. 5)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 3
    quote: "ООО «Авиакомпания «Победа» в качестве доказательства соответствия действительности сведений о стоимости авиаперелета в рекламе представило маршрут-квитанцию на пассажиров, осуществивших перелет из Челябинска в Москву, согласно которой стоимость авиаперелета на одного пассажира составила 1546,60 рублей и состоит из минимального тарифа 999 рублей, а также аэропортовых пассажирских сборов 347,60 рублей (аэропортовый сбор ТА2 – 188,70 рублей, аэропортовый сбор PF2 - 208,90 рублей) и сбора за дополнительную услугу 200 рублей (сбор за услугу бронирования)."
  - page: 3
    quote: "Однако информация о стоимости тарифа без учета сборов, предусмотренных правилами применения тарифа, указана в рекламе способом затрудняющим её восприятие, а именно очень мелким, почти нечитаемым шрифтом бледно-голубого цвета на синем фоне путем вертикального расположения строк."
  - page: 3
    quote: "Специалистами Челябинского УФАС России осуществлена онлайн-подборка билета на рейс из Челябинска в Москву, в результате которой был предложен билет не по минимальному тарифу 999 рублей, а по тарифу 1999 рублей, в связи с чем стоимость перелета, включающая тариф в совокупности с дополнительными сборами в размере 547,60 рублей, составила 2546,60 рублей."
  - page: 4
    quote: "Реклама ООО «Авиакомпания «Победа», в которой присутствуют сведения «победа…Летим в МОСКВУ! от 999 рублей… www.pobeda.aero», размещенная в декабре 2014 года на рекламных конструкциях в городе Челябинске, противоречит требованиям части 7 статьи 5 Федерального закона «О рекламе», ответственность за нарушение которой предусмотрена частью 1 статьи 14.3 Кодекса РФ об административных правонарушениях."
site_or_app: pobeda.aero
