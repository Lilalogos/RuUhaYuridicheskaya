notes: >-
  1) source.pdf — печать страницы ГИС ЗПП (Роспотребнадзор), где опубликован текст решения; рядом source.docx — вложение «РЕШЕНИЕ по ИрАэро» с той же страницы. Документ суда (sudrf) не открывался — капча.
  2) case_number взят из заголовка карточки ГИС ЗПП (стр. 1), в самом тексте решения номер обезличен.
  3) Описание шагов оформления (стр. 3–5, 7–10) — изложение материалов/контрольной покупки Управления в тексте решения; даты контрольной покупки обезличены «<дата>».
  4) В карточке ГИС ЗПП «Дата поступления: 10 ноября 2002 г.» (стр. 1) — расхождение с годом дела, не исправлялось.
  5) На стр. 5 сайт записан «https://iraero/ru», на стр. 7 «httrs://iraero.ru», на стр. 14 «https://iraero.ru» — как в документе.
  6) Апелляция (Иркутский облсуд, 10.09.2024) и кассация (8КСОЮ, 18.02.2025) оставили решение без изменения — по тексту enforcement/2025-8kas-88-2897-2025/source.pdf, стр. 2 и 5; в поле stage не перенесено, т.к. поле заполняется из своего source.pdf.
  7) Факты относятся к периоду до 69-ФЗ (01.09.2025).
  8) Карточка дела на сайте суда (card.pdf/card.html, снимок 2026-10-04): «Иск УДОВЛЕТВОРЕН» 24.01.2024; апелляционная жалоба в Иркутский областной суд рассмотрена 10.09.2024 — «Оставить решение (определение) БЕЗ ИЗМЕНЕНИЯ, а жалобу или представление без удовлетворения» (card.pdf).
