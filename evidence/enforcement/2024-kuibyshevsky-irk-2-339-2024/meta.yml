sanction: "Признать противоправными действия … выразившиеся в автоматическом включении в договор авиаперевозки пассажиров дополнительных платных услуг страхования и выбора места воздушного судна без согласования пассажира; обязать в течение 10 дней с момента вступления решения в законную силу довести решение до сведения потребителей через СМИ; госпошлина 6000 рублей (стр. 15)"
stage: Не установлено по приложенным источникам
interface_facts:
  - page: 10
    quote: "При нажатии «Продолжить» происходит переход на страницу выбора места, при этом стоимость авиабилета автоматически увеличивается на 499 руб., и указано к оплате 7 999 руб."
  - page: 10
    quote: "После заполнения всех граф (персональных данных пассажира) стоимость авиабилета автоматически, без волеизъявления потребителя, увеличивается на 300 руб., а именно автоматически подключены дополнительные платные услуги «Страхование – 300 руб.», при этом указано, что к оплате 7 800 руб."
  - page: 10
    quote: "При этом, отказ от услуг страхования при оформлении заказа не предусмотрен, имеется только кнопка «Изменить», при её нажатии появляется всплывающее окно с информацией о трех видах страхования"
  - page: 10
    quote: "один из видов страхования «Страхование на время перелета» по цене 300 руб. выбран автоматически, и чтобы удалить автоматически включенную страховку необходимо нажать кнопку «Очистить»"
  - page: 14
    quote: "в веб-форме или программном обеспечении посредника отсутствует заранее проставленное автоматическое согласие."
  - page: 14
    quote: "Фактически потребителю ответчиком, на сайте https://iraero.ru, где от имени АО Авиакомпания «ИрАэро» заключается договор на покупку авиабилета дистанционным способом, также предлагается одномоментно дополнительно заключить договор страхования дистанционным способом в момент покупки авиабилета путем проставления галочки, что свидетельствует о навязывании услуги."
site_or_app: iraero.ru                       # стр. 14: «на сайте https://iraero.ru»
